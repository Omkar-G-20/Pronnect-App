<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronnect — Discover Teams & Build Projects Together</title>
  <meta name="description" content="Pronnect is a modern platform to discover project teammates, manage Kanban tasks, chat in real-time, and ship collaborative projects.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- Gun.js Real-Time Decentralized Mesh Sync (Unlimited, Zero Daily Request Limits) -->
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>

  <style>
    :root {
      --c-cream: #F1ECE6;
      --c-sand: #DDD5CD;
      --c-burgundy: #7D4047;
      --c-charcoal: #2E2E2E;
      --c-charcoal-card: #383434;
      --c-charcoal-dark: #222020;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--c-charcoal); color: var(--c-cream); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    
    /* Layout & Container */
    .container { max-width: 1200px; margin: 0 auto; width: 100%; padding: 24px 16px; flex: 1; }
    nav { background: rgba(46, 46, 46, 0.92); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(221, 213, 205, 0.25); position: sticky; top: 0; z-index: 50; padding: 14px 24px; }
    .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .nav-links { display: flex; gap: 8px; align-items: center; }
    
    /* Glassmorphism & Cards */
    .glass-card { background: rgba(56, 52, 52, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(221, 213, 205, 0.22); border-radius: 14px; padding: 22px; transition: transform 0.2s, border-color 0.2s; color: var(--c-cream); }
    .glass-card:hover { border-color: var(--c-burgundy); }
    .glass-pill { background: rgba(46, 46, 46, 0.85); border: 1px solid rgba(221, 213, 205, 0.35); border-radius: 9999px; }
    
    /* Grids & Flex */
    .grid { display: grid; gap: 18px; }
    .grid-3 { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .grid-kanban { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    
    /* Typography & Visuals */
    .gradient-text { background: linear-gradient(135deg, var(--c-cream) 0%, var(--c-sand) 40%, var(--c-burgundy) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
    .hero-glow { position: absolute; top: -120px; left: 50%; transform: translateX(-50%); width: 600px; height: 350px; background: radial-gradient(circle, rgba(125, 64, 71, 0.4) 0%, rgba(221, 213, 205, 0.15) 50%, transparent 70%); filter: blur(60px); pointer-events: none; z-index: 0; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .text-muted { color: var(--c-sand); opacity: 0.85; }
    
    /* Badges */
    .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 500; background: var(--c-charcoal); border: 1px solid rgba(221, 213, 205, 0.3); color: var(--c-sand); }
    .badge-indigo, .badge-accent { background: rgba(125, 64, 71, 0.25); border-color: rgba(125, 64, 71, 0.6); color: var(--c-cream); }
    .badge-green { background: rgba(125, 64, 71, 0.2); border-color: rgba(221, 213, 205, 0.4); color: var(--c-sand); }
    .badge-yellow { background: rgba(221, 213, 205, 0.15); border-color: rgba(221, 213, 205, 0.4); color: var(--c-sand); }
    
    /* Forms & Buttons */
    input, textarea, select { width: 100%; padding: 10px 14px; background: var(--c-charcoal-dark); border: 1px solid rgba(221, 213, 205, 0.25); border-radius: 8px; color: var(--c-cream); font-size: 0.875rem; outline: none; transition: border-color 0.2s; }
    input:focus, textarea:focus, select:focus { border-color: var(--c-burgundy); }
    button { cursor: pointer; border: none; border-radius: 8px; font-weight: 500; font-size: 0.875rem; transition: all 0.2s; }
    .btn { padding: 9px 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: var(--c-burgundy); color: var(--c-cream); box-shadow: 0 4px 14px rgba(125, 64, 71, 0.4); }
    .btn-primary:hover { background: #964e56; transform: translateY(-1px); }
    .btn-secondary { background: var(--c-charcoal-card); color: var(--c-cream); border: 1px solid rgba(221, 213, 205, 0.3); }
    .btn-secondary:hover { background: #444040; border-color: var(--c-sand); }
    .btn-sm { padding: 6px 12px; font-size: 0.75rem; }
    
    /* Chat Layout & Presence Sidebar */
    .chat-layout { display: grid; grid-template-columns: 1fr 240px; gap: 16px; }
    @media (max-width: 768px) { .chat-layout { grid-template-columns: 1fr; } }
    .chat-box { height: 440px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--c-charcoal-dark); border: 1px solid rgba(221, 213, 205, 0.15); border-radius: 8px; }
    .msg-group { display: flex; flex-direction: column; position: relative; }
    .msg-bubble { padding: 8px 14px; border-radius: 16px; max-width: 80%; font-size: 0.875rem; word-break: break-word; }
    .msg-me { align-self: flex-end; background: var(--c-burgundy); color: var(--c-cream); border-bottom-right-radius: 2px; }
    .msg-other { align-self: flex-start; background: var(--c-charcoal-card); color: var(--c-cream); border: 1px solid rgba(221, 213, 205, 0.2); border-bottom-left-radius: 2px; }
    
    /* Message Hover Action Toolbar */
    .msg-hover-actions {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      transform: translateY(2px);
    }
    .msg-group:hover .msg-hover-actions,
    .msg-group:focus-within .msg-hover-actions {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    
    /* Online indicator pulse */
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-online { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
    .status-offline { background: var(--c-sand); opacity: 0.5; }
    
    /* Typing Indicator Animation */
    .typing-indicator { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; font-size: 0.75rem; color: var(--c-sand); font-style: italic; }
    .typing-dot { width: 4px; height: 4px; background: var(--c-sand); border-radius: 50%; animation: blink 1.2s infinite ease-in-out; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }
    
    /* Progress Track */
    .progress-track { width: 100%; height: 10px; background: var(--c-charcoal-dark); border-radius: 9999px; overflow: hidden; border: 1px solid rgba(221, 213, 205, 0.2); }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--c-burgundy), var(--c-sand)); transition: width 0.4s; }
    
    /* Toast System - High Z-Index so it appears above all modals */
    #toast-root { position: fixed; top: 24px; right: 24px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; max-width: 380px; }
    .toast { padding: 14px 20px; border-radius: 10px; font-size: 0.875rem; font-weight: 500; background: #222020; border: 1px solid var(--c-sand); color: var(--c-cream); box-shadow: 0 12px 32px rgba(0,0,0,0.8), 0 0 10px rgba(125,64,71,0.3); pointer-events: auto; animation: toastIn 0.25s ease-out; }
    .toast-err { border-color: #ef4444; background: #3b1418; color: #fecaca; }
    @keyframes toastIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .auth-error-banner { display: none; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 0.825rem; line-height: 1.4; }

    /* Bento Grid Features */
    .bento-card { background: linear-gradient(180deg, rgba(56, 52, 52, 0.5) 0%, rgba(46, 46, 46, 0.7) 100%); border: 1px solid rgba(221, 213, 205, 0.25); border-radius: 16px; padding: 28px; }

    /* In-App Glassmorphism Modal System */
    .modal-overlay { position: fixed; inset: 0; background: rgba(34, 32, 32, 0.85); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: var(--c-charcoal); border: 1px solid rgba(125, 64, 71, 0.6); border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 30px rgba(125, 64, 71, 0.25); transform: scale(0.95); transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden; color: var(--c-cream); }
    .modal-overlay.active .modal-card { transform: scale(1); }
    .modal-header { padding: 18px 24px; border-bottom: 1px solid rgba(221, 213, 205, 0.2); display: flex; justify-content: space-between; align-items: center; background: rgba(56, 52, 52, 0.4); }
    .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid rgba(221, 213, 205, 0.2); display: flex; justify-content: flex-end; gap: 10px; background: rgba(46, 46, 46, 0.7); }
    .modal-close-btn { background: transparent; border: none; color: var(--c-sand); font-size: 1.2rem; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .modal-close-btn:hover { background: var(--c-charcoal-card); color: var(--c-cream); }

    /* Input with action toggle */
    .input-with-btn { display: flex; position: relative; }
    .input-with-btn input { padding-right: 42px; }
    .input-toggle-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; font-size: 1rem; color: var(--c-sand); padding: 4px; border-radius: 4px; cursor: pointer; }
    .input-toggle-btn:hover { color: var(--c-cream); }

    /* Landing Page Section Components */
    .section-title { text-align: center; margin-bottom: 24px; }
    .section-title h2 { font-size: clamp(1.8rem, 3.5vw, 2.5rem); font-weight: 800; color: var(--c-cream); letter-spacing: -0.02em; }
    .section-separator { width: 60px; height: 3px; background: var(--c-burgundy); margin: 10px auto 14px; border-radius: 2px; }
    
    .service-nav-btn { background: var(--c-charcoal-dark); border: 1px solid rgba(221,213,205,0.2); color: var(--c-sand); padding: 14px 20px; border-radius: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s ease; flex: 1; min-width: 140px; }
    .service-nav-btn.active, .service-nav-btn:hover { background: var(--c-burgundy); color: var(--c-cream); border-color: var(--c-burgundy); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(125,64,71,0.35); }

    .accordion-header { background: var(--c-charcoal-dark); border: 1px solid rgba(221,213,205,0.2); padding: 14px 18px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.95rem; color: var(--c-cream); transition: all 0.2s; }
    .accordion-header:hover { border-color: var(--c-burgundy); }
    .accordion-body { background: rgba(0,0,0,0.2); border: 1px solid rgba(221,213,205,0.1); border-top: none; border-radius: 0 0 10px 10px; padding: 14px 18px; color: var(--c-sand); font-size: 0.875rem; line-height: 1.6; display: none; }
    .accordion-body.active { display: block; }

    .stat-card { background: var(--c-charcoal-dark); border: 1px solid rgba(221,213,205,0.2); border-radius: 12px; padding: 24px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; transition: transform 0.2s, border-color 0.2s; }
    .stat-card:hover { transform: translateY(-3px); border-color: var(--c-burgundy); }
    .stat-number { font-size: 2.4rem; font-weight: 800; color: var(--c-cream); line-height: 1; }

    .filter-tab-btn { background: var(--c-charcoal-dark); border: 1px solid rgba(221,213,205,0.25); color: var(--c-sand); padding: 8px 16px; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .filter-tab-btn.active, .filter-tab-btn:hover { background: var(--c-burgundy); color: var(--c-cream); border-color: var(--c-burgundy); }
  </style>
</head>


<body>
  <!-- NAV -->
  <nav>
    <div class="nav-inner">
      <div style="display:flex; align-items:center; gap:20px;">
        <div onclick="navigate('home')" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <div style="width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg, var(--c-cream), var(--c-burgundy)); display:flex; align-items:center; justify-content:center; font-weight:bold; color:var(--c-charcoal); font-size:1.1rem; box-shadow:0 0 16px rgba(125,64,71,0.4);">P</div>
          <span class="gradient-text" style="font-size:1.35rem;">Pronnect</span>
        </div>
        <div class="nav-links">
          <button class="btn btn-secondary" onclick="navigate('home')">Home</button>
          <button class="btn btn-secondary" onclick="navigate('explore')">Explore Projects</button>
          <button class="btn btn-secondary" onclick="navigate('global-chat')">Community Chat</button>
          <button class="btn btn-secondary" onclick="navigate('new-project')">+ Create Project</button>
        </div>
      </div>
      <div id="nav-auth" style="display:flex; align-items:center; gap:12px;"></div>
    </div>
  </nav>

  <!-- MAIN APP ROOT -->
  <main class="container" id="app-root"></main>

  <!-- IN-APP MODAL ROOT -->
  <div id="app-modal" class="modal-overlay" onclick="handleModalOverlayClick(event)">
    <div class="modal-card" id="app-modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size:1.1rem; font-weight:700; color:#f8fafc;">Modal Title</h3>
        <button onclick="closeModal()" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast-root"></div>

  <script>
    // --- MULTI-PEER REAL-TIME GLOBAL MESH (P2P + WEBSOCKET RELAYS + LOCALSTORAGE) ---
    const LOCAL_CACHE_KEY = "pronnect_fresh_start_2026_clean_v1";
    const MESH_CHANNEL_NAME = "pronnect_mesh_fresh_2026_clean_v1";

    let store = {
      users: [],
      projects: [],
      members: [],
      joinRequests: [],
      tasks: [],
      polls: [],
      pollVotes: [],
      messages: [],
      media: [],
      presence: {},
      typing: {}
    };

    let currentUser = null;
    let currentView = 'home';
    let activeProjectId = null;
    let activeProjectTab = 'chat';
    let typingTimer = null;
    let pendingAuth = null;
    let unlockedPrivateProjects = {}; // Session store for unlocked private projects
    let domainTags = ["AI/ML", "Web Dev", "Mobile", "Embedded Systems", "Robotics", "IoT", "Cybersecurity", "Data Science", "Research"];

    // Restore cached session if valid
    try {
      const cached = localStorage.getItem(LOCAL_CACHE_KEY);
      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed.currentUser) currentUser = parsed.currentUser;
        if (parsed.store) store = { ...store, ...parsed.store };
      }
    } catch (e) {}

    // Initialize Gun.js Realtime Mesh
    let gunMesh = null;
    try {
      if (typeof Gun !== 'undefined') {
        gunMesh = Gun([
          'https://gun-manhattan.herokuapp.com/gun',
          'https://relay.peer.ooo/gun',
          'https://peer.wallarm.com/gun'
        ]).get('pronnect_global_mesh_store_v4');

        gunMesh.on((data) => {
          if (data && data.payload) {
            try {
              const incoming = JSON.parse(data.payload);
              if (incoming && typeof incoming === 'object') {
                mergeIncomingStore(incoming);
              }
            } catch (err) {}
          }
        });
      }
    } catch (e) {
      console.warn("Gun.js mesh init fallback:", e);
    }

    // Cross-tab broadcast channel
    let meshChannel = null;
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        meshChannel = new BroadcastChannel(MESH_CHANNEL_NAME);
        meshChannel.onmessage = (e) => {
          if (e.data && e.data.store) {
            mergeIncomingStore(e.data.store);
          }
        };
      }
    } catch (e) {}

    function showToast(msg, isError = false) {
      const root = document.getElementById('toast-root');
      const toast = document.createElement('div');
      toast.className = 'toast ' + (isError ? 'toast-err' : '');
      toast.innerHTML = (isError ? '⚠️ ' : '✅ ') + msg;
      root.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3500);
    }

    // --- IN-PAGE MODAL CONTROLS (NO BROWSER POPUPS) ---
    function openModal(title, bodyHTML) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerHTML = bodyHTML;
      document.getElementById('app-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('app-modal').classList.remove('active');
      if (otpResendTimer) {
        clearInterval(otpResendTimer);
        otpResendTimer = null;
      }
    }

    function handleModalOverlayClick(e) {
      if (e.target.id === 'app-modal') closeModal();
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = '🙈';
      } else {
        input.type = 'password';
        btn.innerText = '👁️';
      }
    }

    // Merge incoming remote store with local state
    function mergeIncomingStore(incoming) {
      let changed = false;

      // Merge users
      if (Array.isArray(incoming.users)) {
        incoming.users.forEach(u => {
          const idx = store.users.findIndex(x => x.id === u.id || (x.email && u.email && x.email.toLowerCase() === u.email.toLowerCase()));
          if (idx === -1) {
            store.users.push(u);
            changed = true;
          } else {
            store.users[idx] = { ...store.users[idx], ...u };
          }
        });
      }

      // Merge projects
      if (Array.isArray(incoming.projects)) {
        incoming.projects.forEach(p => {
          const idx = store.projects.findIndex(x => x.id === p.id);
          if (idx === -1) {
            store.projects.push(p);
            changed = true;
          } else {
            store.projects[idx] = { ...store.projects[idx], ...p };
          }
        });
      }

      // Merge members
      if (Array.isArray(incoming.members)) {
        incoming.members.forEach(m => {
          if (!store.members.some(x => x.projectId === m.projectId && x.userId === m.userId)) {
            store.members.push(m);
            changed = true;
          }
        });
      }

      // Merge join requests
      if (Array.isArray(incoming.joinRequests)) {
        incoming.joinRequests.forEach(r => {
          const idx = store.joinRequests.findIndex(x => x.id === r.id);
          if (idx === -1) {
            store.joinRequests.push(r);
            changed = true;
          } else {
            store.joinRequests[idx] = r;
          }
        });
      }

      // Merge tasks
      if (Array.isArray(incoming.tasks)) {
        incoming.tasks.forEach(t => {
          const idx = store.tasks.findIndex(x => x.id === t.id);
          if (idx === -1) {
            store.tasks.push(t);
            changed = true;
          } else {
            store.tasks[idx] = t;
          }
        });
      }

      // Merge polls & votes
      if (Array.isArray(incoming.polls)) {
        incoming.polls.forEach(p => {
          if (!store.polls.some(x => x.id === p.id)) {
            store.polls.push(p);
            changed = true;
          }
        });
      }
      if (Array.isArray(incoming.pollVotes)) {
        store.pollVotes = incoming.pollVotes;
      }

      // Merge messages
      if (Array.isArray(incoming.messages)) {
        incoming.messages.forEach(m => {
          if (!store.messages.some(x => x.id === m.id)) {
            store.messages.push(m);
            changed = true;
          }
        });
      }

      // Merge media
      if (Array.isArray(incoming.media)) {
        incoming.media.forEach(m => {
          if (!store.media.some(x => x.id === m.id)) {
            store.media.push(m);
            changed = true;
          }
        });
      }

      // Merge presence
      if (incoming.presence && typeof incoming.presence === 'object') {
        store.presence = { ...store.presence, ...incoming.presence };
      }

      if (currentUser) {
        store.presence[currentUser.id] = Date.now();
      }

      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ store, currentUser }));

      // Refresh current view
      if (currentView === 'explore') loadProjects();
      if (currentView === 'global-chat') {
        loadGlobalChat();
        renderPresenceList('global-presence-list', null);
      }
      if (currentView === 'project' && activeProjectId) {
        if (activeProjectTab === 'chat') {
          loadProjectChat(activeProjectId);
          renderPresenceList('project-presence-list', activeProjectId);
        }
        if (activeProjectTab === 'tasks') loadProjectTasks(activeProjectId);
        if (activeProjectTab === 'polls') loadProjectPolls(activeProjectId);
        if (activeProjectTab === 'media') loadProjectMedia(activeProjectId);
        if (activeProjectTab === 'progress') loadProjectProgress(activeProjectId);
        if (activeProjectTab === 'requests') loadProjectRequests(activeProjectId);
      }
    }

    // Save and broadcast state to all peers
    async function saveState() {
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ store, currentUser }));

      // 1. Broadcast over Gun.js mesh
      try {
        if (gunMesh) {
          gunMesh.put({ payload: JSON.stringify(store), timestamp: Date.now() });
        }
      } catch (e) {}

      // 2. Broadcast across local browser tabs
      try {
        if (meshChannel) {
          meshChannel.postMessage({ store });
        }
      } catch (e) {}

      // 3. Fallback Node server sync if hosted

      return EMAIL_REGEX.test(String(email).trim());
    }

    // --- STEP 1: DIRECT SIGNUP (NO CODE VERIFICATION) ---
    function handleDirectSignup(e) {
      e.preventDefault();
      clearAuthError();

      const name = document.getElementById('auth-reg-name').value.trim();
      const email = document.getElementById('auth-reg-email').value.trim().toLowerCase();
      const school = document.getElementById('auth-reg-school').value.trim();
      const rawGithub = document.getElementById('auth-reg-github') ? document.getElementById('auth-reg-github').value.trim() : '';
      const password = document.getElementById('auth-reg-password').value;
      const confirmPassword = document.getElementById('auth-reg-confirm-password').value;

      if (!name || !email || !school || !password) {
        showAuthError("Please fill in all required fields.");
        return;
      }

      if (!isValidEmail(email)) {
        showAuthError("Invalid email address. Please enter a valid email (e.g. name@gmail.com).");
        return;
      }

      if (password.length < 4) {
        showAuthError("Password must be at least 4 characters long.");
        return;
      }

      if (password !== confirmPassword) {
        showAuthError("Passwords do not match. Please verify!");
        return;
      }

      const existing = store.users.find(u => u.email && u.email.toLowerCase() === email);
      if (existing) {
        showAuthError("An account with this email already exists. Please log in!");
        return;
      }

      const githubId = rawGithub.replace(/^https?:\/\/github\.com\//, '').replace(/^@/, '');
      const githubUrl = githubId ? `https://github.com/${githubId}` : '';

      const newUser = {
        id: "u_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
        name: name,
        email: email,
        school: school,
        githubId: githubId,
        githubUrl: githubUrl,
        password: password,
        headline: `Builder & Student at ${school}`,
        bio: "Collaborating and building innovative projects with the Pronnect community.",
        skills: ["Full-Stack", "AI/ML"],
        picture: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(name)}`,
        createdAt: new Date().toISOString()
      };

      store.users.push(newUser);
      currentUser = newUser;
      localStorage.setItem("pronnect_user", JSON.stringify(currentUser));
      store.presence[currentUser.id] = Date.now();
      saveState();
      closeModal();
      showToast(`🎉 Account created successfully! Welcome, ${currentUser.name}!`);
      renderNavAuth();
      navigate('explore');
    }

    // --- STEP 2: DIRECT LOGIN (NO CODE VERIFICATION) ---
    function handleDirectLogin(e) {
      e.preventDefault();
      clearAuthError();

      const input = document.getElementById('auth-login-email').value.trim().toLowerCase();
      const password = document.getElementById('auth-login-password').value;

      if (!input || !password) {
        showAuthError("Please enter both email/username and password.");
        return;
      }

      const user = store.users.find(u => 
        (u.email && u.email.toLowerCase() === input) || 
        (u.name && u.name.toLowerCase() === input) ||
        (u.githubId && u.githubId.toLowerCase() === input)
      );

      if (!user) {
        showAuthError("No account found with this email or username. Please switch to '1. Create Account' above to sign up in 5 seconds!");
        return;
      }

      if (user.password && user.password !== password) {
        showAuthError("Incorrect password. Please verify and try again.");
        return;
      }

      currentUser = user;
      localStorage.setItem("pronnect_user", JSON.stringify(currentUser));
      store.presence[currentUser.id] = Date.now();
      saveState();
      closeModal();
      showToast(`✨ Welcome back, ${currentUser.name}!`);
      renderNavAuth();
      navigate('explore');
    }

              <button onclick="navigate('new-project')" class="btn btn-primary">+ Create Project</button>
            </div>
          </div>

          <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
              <input id="search-input" oninput="loadProjects()" placeholder="Search projects by name..." style="flex:1; min-width:200px;" />

            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;" id="tag-filters">
              <button onclick="selectTag('')" id="tag-btn-all" class="badge badge-indigo" style="cursor:pointer; padding:6px 12px;">All Tags</button>
              ${domainTags.map(t => `<button onclick="selectTag('${t}')" id="tag-btn-${t.replace(/[^a-zA-Z]/g, '')}" class="badge" style="cursor:pointer; padding:6px 12px;">${t}</button>`).join('')}
            </div>
          </div>

          <div id="projects-grid" class="grid grid-3"></div>
        </div>
      `;
      loadProjects();
    }

    let activeTag = '';
    function selectTag(tag) {
      activeTag = tag;
      document.querySelectorAll('#tag-filters button').forEach(b => { b.className = 'badge'; });
      const sel = tag ? document.getElementById('tag-btn-' + tag.replace(/[^a-zA-Z]/g, '')) : document.getElementById('tag-btn-all');
      if (sel) sel.className = 'badge badge-indigo';
      loadProjects();
    }

    function loadProjects() {
      const search = document.getElementById('search-input')?.value.toLowerCase() || '';
      const school = document.getElementById('school-input')?.value.toLowerCase() || '';
      
      let list = store.projects || [];

      if (activeTag) list = list.filter(p => p.tags && p.tags.includes(activeTag));
      if (search) list = list.filter(p => p.name.toLowerCase().includes(search) || p.description.toLowerCase().includes(search));
      if (school) {
        list = list.filter(p => {
          const leader = store.users.find(u => u.id === p.leaderId);
          return leader && leader.school && leader.school.toLowerCase().includes(school);
        });
      }

      const grid = document.getElementById('projects-grid');
      if (!grid) return;

      if (list.length === 0) {
        grid.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--c-sand);">
            <div style="font-size:2.5rem; margin-bottom:10px;">🚀</div>
            <h3 style="font-size:1.1rem; color:var(--c-cream); margin-bottom:6px;">No projects created yet</h3>
            <p class="text-muted text-sm" style="margin-bottom:16px;">Create a project to start collaborating with team members across different profiles!</p>
            <button onclick="navigate('new-project')" class="btn btn-primary">+ Create Project</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(p => {
        const leader = store.users.find(u => u.id === p.leaderId);
        const memberCount = store.members.filter(m => m.projectId === p.id).length || 1;
        const isPrivate = p.visibility === 'PRIVATE';
        const isLeader = currentUser && p.leaderId === currentUser.id;
        const isMember = isLeader || (currentUser && store.members.some(m => m.projectId === p.id && m.userId === currentUser.id));

        return `
          <div class="glass-card flex flex-col justify-between" style="cursor:pointer;" onclick="handleProjectCardClick('${p.id}')">
            <div>
              <div class="flex justify-between items-center" style="margin-bottom:8px;">
                <div style="display:flex; align-items:center; gap:6px;">
                  <h3 style="font-size:1.1rem; font-weight:600; color:var(--c-cream);">${escapeHtml(p.name)}</h3>
                  ${isPrivate ? '<span class="badge badge-yellow">🔒 Private</span>' : ''}
                </div>
                <span class="badge">${memberCount} member${memberCount !== 1 ? 's' : ''}</span>
              </div>
              <p class="text-muted text-sm" style="margin-bottom:12px;">${escapeHtml(p.description)}</p>
              <div style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:16px;">
                ${(p.tags || []).map(t => `<span class="badge badge-indigo">${t}</span>`).join('')}
              </div>
            </div>
            <div class="flex justify-between items-center" style="padding-top:10px; border-top:1px solid rgba(221,213,205,0.2);">
              <div style="font-size:0.75rem; color:var(--c-sand);">
                <div>Led by <strong>${leader ? escapeHtml(leader.name) : 'Leader'}</strong></div>
                ${leader && leader.school ? `<div>🎓 ${escapeHtml(leader.school)}</div>` : ''}
              </div>
              <button class="btn btn-secondary btn-sm">${isPrivate && !isMember ? 'Unlock &rarr;' : 'Open &rarr;'}</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleProjectCardClick(projId) {
      promptJoinOrEnterProject(projId);
    }

    function promptJoinOrEnterProject(projId) {
      const p = store.projects.find(x => x.id === projId);
      if (!p) return;

      if (!currentUser) {
        showAuthModal('signup');
        return;
      }

      const isLeader = currentUser && p.leaderId === currentUser.id;
      const isMember = isLeader || store.members.some(m => m.projectId === p.id && m.userId === currentUser.id);

      // If approved member or leader:
      if (isMember) {
        if (p.visibility === 'PRIVATE' && !isLeader && !unlockedPrivateProjects[p.id]) {
          // Private project requires password verification
          promptUnlockPrivatePasswordModal(p.id);
          return;
        }
        // Public projects (and unlocked private projects) open immediately with NO password
        navigate('project', p.id);
        return;
      }

      // If NOT a member, must send a Join Request (for BOTH public and private projects)
      const pendingReq = store.joinRequests.find(r => r.projectId === p.id && r.userId === currentUser.id && r.status === 'PENDING');
      const isPrivate = p.visibility === 'PRIVATE';
      const leader = store.users.find(u => u.id === p.leaderId);

      openModal(isPrivate ? "🔒 Private Project Workspace" : "🌐 Public Project Workspace", `
        <div style="display:flex; flex-direction:column; gap:16px;">
          
          <!-- Project Summary Card -->
          <div style="background:var(--c-charcoal-dark); padding:16px; border-radius:10px; border:1px solid rgba(221,213,205,0.2);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <h3 style="font-size:1.1rem; font-weight:700; color:var(--c-cream);">${escapeHtml(p.name)}</h3>
              <span class="badge ${isPrivate ? 'badge-yellow' : 'badge-green'}">${isPrivate ? '🔒 Private' : '🌐 Public'}</span>
            </div>
            <p class="text-muted text-xs" style="line-height:1.5;">${escapeHtml(p.description)}</p>
            <div style="margin-top:10px; font-size:0.75rem; color:var(--c-sand); display:flex; gap:12px; flex-wrap:wrap;">
              <span>👑 Led by: <strong>${leader ? escapeHtml(leader.name) : 'Leader'}</strong></span>
              <span>👥 Team size: <strong>${store.members.filter(m => m.projectId === p.id).length || 1} members</strong></span>
            </div>
          </div>

          <!-- Info notice explaining requirements -->
          <div style="background:rgba(125,64,71,0.15); border:1px solid rgba(125,64,71,0.35); border-radius:8px; padding:12px; font-size:0.8rem; color:var(--c-cream); line-height:1.5;">
            ℹ️ <strong>Membership Approval Required:</strong> To join this workspace and access chats, Kanban tasks, and polls, send a join request. The project leader will review your profile to validate your skills and credentials.
            ${isPrivate ? '<br><span style="color:var(--c-sand); font-size:0.75rem;">🔒 <em>Private Project: Once approved, you will enter the project password to access the workspace.</em></span>' : '<br><span style="color:var(--c-sand); font-size:0.75rem;">🌐 <em>Public Project: Once approved, you can enter anytime with no password needed!</em></span>'}
          </div>

          ${pendingReq ? `
            <div style="background:rgba(234, 179, 8, 0.15); border:1px solid rgba(234, 179, 8, 0.4); padding:14px; border-radius:8px; text-align:center; font-size:0.85rem; color:#fde047; font-weight:600;">
              ⏳ Your Join Request is Pending Leader Review & Validation
            </div>
          ` : `
            <form onsubmit="handleSendJoinRequest(event, '${p.id}')" style="display:flex; flex-direction:column; gap:10px;">
              <div>
                <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Intro Note / Intended Role (Optional)</label>
                <input id="join-req-note" placeholder="e.g. Full-Stack Engineer excited to build features & API" style="background:var(--c-charcoal-dark);" />
              </div>
              <button type="submit" class="btn btn-primary" style="padding:12px; font-weight:700;">
                📝 Send Join Request to Leader &rarr;
              </button>
            </form>
          `}

          <div style="display:flex; justify-content:flex-end;">
            <button type="button" onclick="closeModal()" class="btn btn-secondary btn-sm">Close</button>
          </div>
        </div>
      `);
    }

    function handleSendJoinRequest(e, projId) {
      e.preventDefault();
      if (!currentUser) { showAuthModal('signup'); return; }

      const note = document.getElementById('join-req-note') ? document.getElementById('join-req-note').value.trim() : '';
      const existing = store.joinRequests.find(r => r.projectId === projId && r.userId === currentUser.id);

      if (existing && existing.status === 'PENDING') {
        showToast("Your join request is already pending leader review!");
        return;
      }

      if (!existing) {
        store.joinRequests.push({
          id: "jr_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
          projectId: projId,
          userId: currentUser.id,
          note: note,
          status: "PENDING",
          createdAt: new Date().toISOString()
        });
      } else {
        existing.status = "PENDING";
        existing.note = note;
      }

      saveState();
      closeModal();
      showToast("Join request sent! The leader will validate your profile.");
      renderExploreView();
    }

    // In-App Modal for Private Project Password Unlock

      const p = store.projects.find(x => x.id === projId);
      if (!p) return;

      openModal("🔒 Enter Private Project Password", `
        <form onsubmit="handlePrivatePasswordUnlockSubmit(event, '${p.id}')" style="display:flex; flex-direction:column; gap:14px;">
          <div style="background:var(--c-charcoal-dark); padding:14px; border-radius:8px; border:1px solid rgba(221,213,205,0.2);">
            <div style="font-weight:700; color:var(--c-cream); font-size:1rem;">${escapeHtml(p.name)}</div>
            <div class="text-muted text-xs" style="margin-top:2px;">You are an approved collaborator. Enter the private project password to unlock the workspace:</div>
          </div>

          <div>
            <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Project Password *</label>
            <div class="input-with-btn">
              <input id="modal-priv-pass-input" type="password" required placeholder="Enter private password" autofocus style="background:var(--c-charcoal-dark);" />
              <button type="button" class="input-toggle-btn" onclick="togglePasswordVisibility('modal-priv-pass-input', this)">👁️</button>
            </div>
          </div>

          <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:4px;">
            <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn btn-primary" style="flex:1;">🔓 Unlock & Enter Workspace &rarr;</button>
          </div>
        </form>
      `);
    }

    function handlePrivatePasswordUnlockSubmit(e, projId) {
      e.preventDefault();
      const p = store.projects.find(x => x.id === projId);
      if (!p) return;

      const entered = (document.getElementById('modal-priv-pass-input').value || '').trim();
      if (entered === (p.password || '').trim()) {
        unlockedPrivateProjects[projId] = true;
        closeModal();
        showToast("Password verified! Workspace unlocked.");
        navigate('project', projId);
      } else {
        showToast("Incorrect private project password. Please try again!", true);
      }
    }

          <p class="text-muted text-xs">Project password for approved members to unlock this private workspace:</p>

    // --- FILE & MEDIA HELPER STATE ---
    // --- PROFANITY & SENSITIVE CONTENT CENSORSHIP FILTER ---
    const BANNED_PATTERNS = [
      /\b(fuck|fucking|fucker|shit|shitting|bitch|bitches|asshole|bastard|dick|dicks|pussy|cunt|nigger|nigga|faggot|slut|whore|retard|scam|scammer)\b/gi
    ];

    function censorProfanity(text) {
      if (!text) return text;
      let cleaned = String(text);
      BANNED_PATTERNS.forEach(regex => {
        cleaned = cleaned.replace(regex, match => '*'.repeat(match.length));
      });
      return cleaned;
    }

    // --- FILE & MEDIA HELPER STATE ---
    let stagedFiles = { project: null, global: null };

    function formatFileSize(bytes) {
      if (!bytes) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function triggerFileInput(scope) {
      const input = document.getElementById(scope + '-file-input');
      if (input) input.click();
    }

    function handleFileSelected(e, scope) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (file.size > 8 * 1024 * 1024) {
        showToast("File size too large! Please upload files under 8MB.", true);
        return;
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        stagedFiles[scope] = {
          name: file.name,
          type: file.type || 'application/octet-stream',
          size: file.size,
          data: evt.target.result
        };
        renderFilePreview(scope);
        showToast("File attached: " + file.name);
      };
      reader.readAsDataURL(file);
    }

    function clearStagedFile(scope) {
      stagedFiles[scope] = null;
      const input = document.getElementById(scope + '-file-input');
      if (input) input.value = '';
      renderFilePreview(scope);
    }

    function renderFilePreview(scope) {
      const previewEl = document.getElementById(scope + '-file-preview');
      if (!previewEl) return;
      const f = stagedFiles[scope];
      if (!f) {
        previewEl.style.display = 'none';

      previewEl.style.display = 'flex';
      previewEl.innerHTML = `

    }

    // --- AUDIO / VOICE MESSAGE RECORDER ---
    let audioRecorder = null;
    let audioRecordChunks = [];
    let isRecordingVoice = false;
    let voiceTimer = null;
    let voiceSeconds = 0;

    async function toggleAudioRecording(scope, projId = '') {
      if (isRecordingVoice) {
        stopAudioRecording(scope, projId, true);
      } else {
        startAudioRecording(scope, projId);
      }
    }

    async function startAudioRecording(scope, projId = '') {
      if (!currentUser) { showAuthModal('signup'); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioRecordChunks = [];
        audioRecorder = new MediaRecorder(stream);

        audioRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioRecordChunks.push(e.data);
        };

        audioRecorder.onstop = async () => {
          const audioBlob = new Blob(audioRecordChunks, { type: 'audio/webm' });
          stream.getTracks().forEach(t => t.stop());

          if (audioBlob.size > 100) {
            const reader = new FileReader();
            reader.onload = async function(evt) {
              const base64Audio = evt.target.result;
              await sendVoiceMessage(base64Audio, scope, projId);
            };
            reader.readAsDataURL(audioBlob);
          }
        };

        audioRecorder.start();
        isRecordingVoice = true;
        voiceSeconds = 0;
        updateAudioRecordingUI(scope, true);

        voiceTimer = setInterval(() => {
          voiceSeconds++;
          const timerEl = document.getElementById(scope + '-recording-timer');
          if (timerEl) {
            const mins = Math.floor(voiceSeconds / 60);
            const secs = voiceSeconds % 60;
            timerEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
          }
        }, 1000);
      } catch (err) {
        showToast("Microphone access unavailable or denied.", true);
      }
    }

    function stopAudioRecording(scope, projId = '', send = true) {
      if (!isRecordingVoice || !audioRecorder) return;
      if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
      if (!send) audioRecordChunks = [];
      audioRecorder.stop();
      isRecordingVoice = false;
      updateAudioRecordingUI(scope, false);
    }

    function updateAudioRecordingUI(scope, recording) {
      const bar = document.getElementById(scope + '-audio-bar');
      const micBtn = document.getElementById(scope + '-mic-btn');
      if (bar) bar.style.display = recording ? 'flex' : 'none';
      if (micBtn) {
        micBtn.style.color = recording ? '#ff4d4f' : 'inherit';
        micBtn.innerHTML = recording ? '⏹️' : '🎙️';
      }
    }

        projectId: scope === 'project' ? projId : null,

        store.media.push({

      }

      store.messages.push(newMsg);
      await saveState();
      if (scope === 'project') loadProjectChat(projId);
      else loadGlobalChat();
      showToast("Voice message sent!");
    }

    async function handleEditMessageSubmit(e, msgId, scope, projId) {
      e.preventDefault();
      const m = store.messages.find(x => x.id === msgId);
      if (!m) return;
      const msgAgeMs = Date.now() - new Date(m.createdAt).getTime();
      if (msgAgeMs > 5 * 60 * 1000) {
        showToast("Edit window expired (5 minute limit).", true);
        closeModal();
        return;
      }
      const newContent = censorProfanity(document.getElementById('modal-edit-msg-input').value.trim());
      if (!newContent) return;

      m.content = newContent;
      m.isEdited = true;
      m.updatedAt = new Date().toISOString();
      await saveState();
      closeModal();
      showToast("Message updated!");
      if (scope === 'project') loadProjectChat(projId);
      else loadGlobalChat();
    }

    async function deleteMessageForMe(msgId, scope, projId = '') {
      if (!currentUser) return;
      const m = store.messages.find(x => x.id === msgId);
      if (!m) return;
      if (!m.deletedFor) m.deletedFor = [];
      if (!m.deletedFor.includes(currentUser.id)) {
        m.deletedFor.push(currentUser.id);
      }
      await saveState();
      showToast("Message deleted for you.");
      if (scope === 'project') loadProjectChat(projId);
      else loadGlobalChat();
    }

    async function deleteMessageForEveryone(msgId, scope, projId = '') {
      if (!currentUser) return;
      const m = store.messages.find(x => x.id === msgId);
      if (!m) return;
      const proj = store.projects.find(p => p.id === projId);
      const isLeader = proj && proj.leaderId === currentUser.id;
      const isMe = m.senderId === currentUser.id;
      if (!isMe && !isLeader) {
        showToast("Unauthorized: You can only delete your own messages for everyone.", true);
        return;
      }
      m.isDeleted = true;
      m.content = "🚫 This message was deleted";
      m.file = null;
      m.audio = null;
      m.link = null;
      await saveState();
      showToast("Message deleted for everyone.");
      if (scope === 'project') loadProjectChat(projId);
      else loadGlobalChat();
    }

    function handleTyping(roomId) {
      if (!currentUser) return;
      if (!store.typing) store.typing = {};
      store.typing[roomId] = {
        userId: currentUser.id,
        userName: currentUser.name,
        timestamp: Date.now()
      };
      
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        if (store.typing && store.typing[roomId]) {
          delete store.typing[roomId];
          saveState();
        }
      }, 3000);
      saveState();
    }

    function renderTypingStatus(elementId, roomId) {
      const el = document.getElementById(elementId);
      if (!el || !store.typing || !store.typing[roomId]) {
        if (el) el.style.display = 'none';
        return;
      }
      const t = store.typing[roomId];
      if (currentUser && t.userId === currentUser.id) {
        el.style.display = 'none';
        return;
      }
      if (Date.now() - t.timestamp < 4000) {
        el.style.display = 'inline-flex';
        el.innerHTML = `<span>${escapeHtml(t.userName)} is typing</span><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
      } else {
        el.style.display = 'none';
      }
    }

    function renderPresenceList(elementId, projId) {
      const container = document.getElementById(elementId);
      if (!container) return;

      const now = Date.now();
      const onlineThreshold = 15000;

      let candidateUsers = store.users;
      if (projId) {
        const projectMemberIds = store.members.filter(m => m.projectId === projId).map(m => m.userId);
        const proj = store.projects.find(p => p.id === projId);
        if (proj) projectMemberIds.push(proj.leaderId);
        candidateUsers = store.users.filter(u => projectMemberIds.includes(u.id));
      }

      let onlineCount = 0;
      const html = candidateUsers.map(u => {
        const lastActive = (store.presence && store.presence[u.id]) || 0;
        const isOnline = (now - lastActive < onlineThreshold) || (currentUser && currentUser.id === u.id);
        if (isOnline) onlineCount++;

        return `
          <div style="display:flex; align-items:center; justify-content:space-between; font-size:0.8rem; background:var(--c-charcoal-dark); padding:6px 10px; border-radius:6px; border:1px solid rgba(221,213,205,0.15);">
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="status-dot ${isOnline ? 'status-online' : 'status-offline'}"></span>
              <span style="font-weight:500;">${escapeHtml(u.name)}</span>
            </div>
            <span class="text-xs text-muted" style="font-size:10px;">${isOnline ? 'Online' : 'Offline'}</span>
          </div>
        `;
      }).join('');

      container.innerHTML = html || '<div class="text-muted text-xs">No active members</div>';
      
      const countBadge = document.getElementById(projId ? 'project-online-count' : 'global-online-count');
      if (countBadge) countBadge.innerText = Math.max(1, onlineCount);
    }

    async function sendProjectMessage(e, projId) {
      e.preventDefault();
      if (!currentUser) { showAuthModal('signup'); return; }
      const input = document.getElementById('proj-msg-input');
      const rawContent = input ? input.value.trim() : '';
      const content = censorProfanity(rawContent);
      const attachedFile = stagedFiles.project;

      if (!content && !attachedFile) return;

      if (input) input.value = '';

      if (store.typing && store.typing['proj_' + projId]) {
        delete store.typing['proj_' + projId];
      }

      const newMsg = {
        id: "msg_" + Date.now(),
        projectId: projId,
        senderId: currentUser.id,
        content: content,
        file: attachedFile || null,
        createdAt: new Date().toISOString()
      };

      // Auto-populate Project Media Section with uploaded file!
      if (attachedFile) {
        store.media.push({
          id: "med_file_" + Date.now(),
          projectId: projId,
          name: attachedFile.name,
          url: attachedFile.data,
          type: attachedFile.type,
          size: attachedFile.size,
          sharedBy: currentUser.name,
          createdAt: new Date().toISOString()
        });
      }

      store.messages.push(newMsg);
      clearStagedFile('project');
      await saveState();
      loadProjectChat(projId);
    }

    // --- KANBAN TASKS ---
    function loadProjectTasks(projId) {
      const container = document.getElementById('project-tab-content');
      if (!container) return;
      container.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div class="flex justify-between items-center">
            <h3 style="font-weight:600;">Project Tasks</h3>
            <button onclick="showCreateTaskModal('${projId}')" class="btn btn-primary btn-sm">+ Add Task</button>
          </div>
          <div id="tasks-board" class="grid grid-kanban"></div>
        </div>
      `;
      const tasks = store.tasks.filter(t => t.projectId === projId);
      const todo = tasks.filter(t => t.status === 'TODO');
      const inProgress = tasks.filter(t => t.status === 'IN_PROGRESS');
      const done = tasks.filter(t => t.status === 'DONE');

      document.getElementById('tasks-board').innerHTML = `
        ${renderTaskCol('To Do', todo, 'TODO', projId)}
        ${renderTaskCol('In Progress', inProgress, 'IN_PROGRESS', projId)}
        ${renderTaskCol('Done', done, 'DONE', projId)}
      `;

    function renderTaskCol(title, list, status, projId) {
      return `
        <div class="glass-card" style="display:flex; flex-direction:column; gap:10px;">
          <div class="flex justify-between items-center text-xs" style="font-weight:bold; color:var(--c-sand); text-transform:uppercase;">
            <span>${title}</span>
            <span class="badge">${list.length}</span>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${list.length === 0 ? '<div class="text-muted text-xs" style="text-align:center; padding:12px;">No tasks</div>' : ''}
            ${list.map(t => {
              const assignee = store.users.find(u => u.id === t.assigneeId);
              return `
                <div style="background:var(--c-charcoal-dark); border:1px solid rgba(221,213,205,0.2); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:6px;">
                  <div style="font-size:0.875rem; font-weight:500; color:var(--c-cream);">${escapeHtml(t.title)}</div>

                </div>

          </div>
        </div>

    function updateTaskStatus(taskId, status, projId) {
      const t = store.tasks.find(x => x.id === taskId);
      if (t) { t.status = status; saveState(); }
      loadProjectTasks(projId);
    }

    // In-App Modal for Creating Tasks (No browser popup!)
    function showCreateTaskModal(projId) {
      if (!currentUser) { showAuthModal('signup'); return; }
      
      const projectMembers = store.members.filter(m => m.projectId === projId).map(m => store.users.find(u => u.id === m.userId)).filter(Boolean);
      const proj = store.projects.find(p => p.id === projId);
      if (proj) {
        const leader = store.users.find(u => u.id === proj.leaderId);
        if (leader && !projectMembers.some(m => m.id === leader.id)) projectMembers.unshift(leader);
      }

      openModal("📋 Create New Task", `
        <form onsubmit="handleCreateTaskSubmit(event, '${projId}')" style="display:flex; flex-direction:column; gap:14px;">
          <div>
            <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Task Title</label>
            <input id="modal-task-title" required placeholder="e.g. Integrate obstacle avoidance sensor" autofocus />
          </div>
          <div>
            <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Task Description (optional)</label>
            <textarea id="modal-task-desc" rows="3" placeholder="Add technical specifications or criteria..."></textarea>
          </div>
          <div>
            <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Assignee</label>
            <select id="modal-task-assignee">
              <option value="${currentUser.id}">👤 Assign to Me (${escapeHtml(currentUser.name)})</option>
              ${projectMembers.filter(m => m.id !== currentUser.id).map(m => `<option value="${m.id}">👤 ${escapeHtml(m.name)}</option>`).join('')}
              <option value="">Unassigned</option>
            </select>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
            <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn btn-primary" style="flex:1;">Create Task &rarr;</button>
          </div>
        </form>
      `);
    }

    function handleCreateTaskSubmit(e, projId) {
      e.preventDefault();
      const title = document.getElementById('modal-task-title').value.trim();

    // --- POLLS ---
    function loadProjectPolls(projId) {
      const container = document.getElementById('project-tab-content');
      if (!container) return;
      container.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div class="flex justify-between items-center">
            <h3 style="font-weight:600;">Team Polls</h3>
            <button onclick="showCreatePollModal('${projId}')" class="btn btn-primary btn-sm">+ Create Poll</button>
          </div>
          <div id="polls-list" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
      `;
      const polls = store.polls.filter(p => p.projectId === projId);
      const box = document.getElementById('polls-list');
      if (polls.length === 0) {
        box.innerHTML = '<div class="glass-card" style="text-align:center; padding:30px; color:var(--c-sand);">No polls created yet.</div>';
        return;
      }
      box.innerHTML = polls.map(p => {
        const votes = store.pollVotes.filter(v => v.pollId === p.id);
        const totalVotes = votes.length;
        const userVote = currentUser ? votes.find(v => v.userId === currentUser.id)?.optionIndex : null;

        return `
          <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
            <div style="font-size:1rem; font-weight:600;">${escapeHtml(p.question)}</div>
            <div class="text-muted text-xs">${totalVotes} voter${totalVotes !== 1 ? 's' : ''}</div>
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${p.options.map((opt, idx) => {
                const count = votes.filter(v => v.optionIndex === idx).length;
                const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                const hasVoted = userVote === idx;
                return `
                  <button onclick="votePoll('${p.id}', ${idx}, '${projId}')" class="btn btn-secondary flex justify-between items-center" style="text-align:left; padding:10px 14px; position:relative; overflow:hidden;">
                    <div style="position:absolute; top:0; left:0; bottom:0; width:${pct}%; background:rgba(125, 64, 71, 0.3);"></div>
                    <span style="position:relative; z-index:2;">${escapeHtml(opt)} ${hasVoted ? '✓' : ''}</span>
                    <span class="text-muted text-xs" style="position:relative; z-index:2;">${count} votes (${pct}%)</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function votePoll(pollId, idx, projId) {
      if (!currentUser) { showAuthModal('signup'); return; }
      const existing = store.pollVotes.find(v => v.pollId === pollId && v.userId === currentUser.id);
      if (existing) { existing.optionIndex = idx; }
      else { store.pollVotes.push({ pollId, userId: currentUser.id, optionIndex: idx }); }
      saveState();
      loadProjectPolls(projId);
    }

    function handleJoinRequest(reqId, action, projId) {
      const proj = store.projects.find(p => p.id === projId);
      if (!proj || !currentUser || proj.leaderId !== currentUser.id) {
        showToast("Unauthorized: Only the project leader can approve or deny requests!", true);
        return;
      }

      const r = store.joinRequests.find(x => x.id === reqId);
      if (r) {
        r.status = action;
        if (action === 'APPROVED') {
          if (!store.members.some(m => m.projectId === projId && m.userId === r.userId)) {
            store.members.push({ projectId: projId, userId: r.userId });
          }
        }
        saveState();
      }
      showToast(action === 'APPROVED' ? 'Member approved & added to project!' : 'Request denied.');
      loadProjectRequests(projId);
      renderProjectView(projId);
    }

    function togglePrivatePasswordInput(vis) {
      const box = document.getElementById('private-password-box');
      if (vis === 'PRIVATE') {
        box.style.display = 'block';
        document.getElementById('new-proj-pass').required = true;
      } else {
        box.style.display = 'none';
        document.getElementById('new-proj-pass').required = false;
      }
    }

    let selectedTags = [];
    function toggleTag(t, btn) {
      if (selectedTags.includes(t)) {
        selectedTags = selectedTags.filter(x => x !== t);
        btn.className = 'badge';
      } else {
        selectedTags.push(t);
        btn.className = 'badge badge-indigo';
      }
    }

    async function submitNewProject(e) {
      e.preventDefault();
      const name = document.getElementById('new-proj-name').value.trim();
      const description = document.getElementById('new-proj-desc').value.trim();
      const visibility = document.getElementById('new-proj-vis').value;
      const password = visibility === 'PRIVATE' ? document.getElementById('new-proj-pass').value.trim() : "";

      const newProj = {
        id: "p_" + Date.now() + "_" + Math.random().toString(36).substring(2, 6),
        name,
        description,
        visibility,
        password,
        tags: selectedTags,
        leaderId: currentUser.id,

    function loadGlobalChat() {
      const msgs = store.messages.filter(m => !m.projectId && (!currentUser || !m.deletedFor || !m.deletedFor.includes(currentUser.id)));

      if (!box) return;

        box.innerHTML = '<div style="text-align:center; color:var(--c-sand); margin:auto;">No messages yet. Be the first to say hello to everyone! 🌐</div>';
      } else {
        box.innerHTML = msgs.map(m => {
          const isMe = currentUser && m.senderId === currentUser.id;
          const sender = store.users.find(u => u.id === m.senderId) || { name: 'User' };
          
          if (m.isDeleted) {
            return `
              <div style="display:flex; flex-direction:column; align-items:${isMe ? 'flex-end' : 'flex-start'}; margin-bottom:8px;">

                  🚫 This message was deleted
                </div>
              </div>
            `;
          }

          const msgAgeMs = Date.now() - new Date(m.createdAt).getTime();
          const canEdit = isMe && !m.isDeleted && (msgAgeMs <= 5 * 60 * 1000) && !m.audio && !m.file;
          const canDeleteEveryone = isMe && !m.isDeleted;
          const canDeleteMe = !!currentUser;

          let fileMarkup = '';
          if (m.file) {
            if (m.file.type && m.file.type.startsWith('image/')) {
              fileMarkup = `<img src="${m.file.data}" alt="${escapeHtml(m.file.name)}" onclick="openImageModal('${m.file.data}')" style="max-width:240px; max-height:180px; border-radius:8px; display:block; margin-top:6px; cursor:pointer; border:1px solid rgba(221,213,205,0.2);" />`;
            } else {

          if (m.audio && m.audio.data) {

                <audio controls src="${m.audio.data}" style="height:36px; max-width:240px; border-radius:18px; outline:none;"></audio>
              </div>
            `;
          }

          let linkMarkup = '';
          if (m.link) {
            linkMarkup = `
              <a href="${escapeHtml(m.link.url)}" target="_blank" style="display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.3); border:1px solid var(--c-burgundy); padding:8px 12px; border-radius:8px; margin-top:6px; text-decoration:none; color:inherit;">

            </div>

    async function sendGlobalMessage(e) {
      e.preventDefault();
      if (!currentUser) { showAuthModal('signup'); return; }
      const input = document.getElementById('global-msg-input');
      const rawContent = input ? input.value.trim() : '';
      const content = censorProfanity(rawContent);
      const attachedFile = stagedFiles.global;

      if (!content && !attachedFile) return;

      if (input) input.value = '';

      if (store.typing && store.typing['global']) {
        delete store.typing['global'];
      }

      store.messages.push({
        id: "msg_" + Date.now(),
        projectId: null,
        senderId: currentUser.id,
        content: content,
        file: attachedFile || null,
        createdAt: new Date().toISOString()
      });

      clearStagedFile('global');
      await saveState();
      loadGlobalChat();
    }

      reader.readAsDataURL(file);
