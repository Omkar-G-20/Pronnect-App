      document.querySelectorAll('[id^="proftab-"]').forEach(b => { b.className = 'btn btn-secondary btn-sm'; });
      const activeBtn = document.getElementById('proftab-' + tab);
      if (activeBtn) activeBtn.className = 'btn btn-primary btn-sm';

      const content = document.getElementById('profile-tab-content');
      if (!content) return;

      if (tab === 'overview') {
        const skills = user.skills && user.skills.length > 0 ? user.skills : ['Full-Stack', 'UI/UX', 'AI/ML', 'Problem Solving'];
        const interests = user.interests && user.interests.length > 0 ? user.interests : ['Autonomous Robotics', 'Hackathons', 'Web3', 'AI Systems'];
        const bio = user.bio || 'Passionate about assembling high-performance teams, shipping hackathon projects, and building innovative software.';
        const githubHandle = user.githubId || (user.githubUrl ? user.githubUrl.replace(/^https?:\/\/github\.com\//, '').replace(/^@/, '') : '');

        content.innerHTML = `
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px;">
            <div style="display:flex; flex-direction:column; gap:20px;">
              <!-- About Bio Box -->
              <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
                <h3 style="font-size:1.1rem; font-weight:700;">About & Background</h3>
                <p style="color:var(--c-cream); font-size:0.9rem; line-height:1.6;">${escapeHtml(bio)}</p>
              </div>

              <!-- Skills & Expertise Box -->
              <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
                <h3 style="font-size:1.1rem; font-weight:700;">Skills & Domain Expertise</h3>
                <div style="display:flex; flex-wrap:wrap; gap:8px;">
                  ${skills.map(s => `<span class="badge badge-indigo" style="padding:6px 12px; font-size:0.8rem;">⚡ ${escapeHtml(s)}</span>`).join('')}
                </div>
              </div>

              <!-- Interests & Passions Box -->
              <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
                <h3 style="font-size:1.1rem; font-weight:700;">Interests & Collaboration Focus</h3>
                <div style="display:flex; flex-wrap:wrap; gap:8px;">
                  ${interests.map(i => `<span class="badge badge-green" style="padding:6px 12px; font-size:0.8rem;">🎯 ${escapeHtml(i)}</span>`).join('')}
                </div>
              </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:20px;">
              
              <!-- 🐙 DEDICATED GITHUB PROFILE CARD -->
              <div class="glass-card" style="display:flex; flex-direction:column; gap:12px; border:1px solid rgba(221,213,205,0.3);">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="display:flex; align-items:center; gap:8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                    <h3 style="font-size:1.05rem; font-weight:700;">GitHub Developer Profile</h3>
                  </div>
                  ${githubHandle ? `<span class="badge badge-green">✓ Linked</span>` : `<span class="badge">Not Set</span>`}
                </div>
                
                ${githubHandle ? `
                  <div style="background:var(--c-charcoal-dark); border-radius:8px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border:1px solid rgba(221,213,205,0.15);">
                    <div style="display:flex; align-items:center; gap:10px;">
                      <img src="https://github.com/${encodeURIComponent(githubHandle)}.png" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(githubHandle)}'" style="width:36px; height:36px; border-radius:50%; border:1px solid var(--c-burgundy);" />
                      <div>
                        <div style="font-weight:700; color:var(--c-cream); font-size:0.9rem;">@${escapeHtml(githubHandle)}</div>
                        <div class="text-muted text-xs">github.com/${escapeHtml(githubHandle)}</div>
                      </div>
                    </div>
                    <a href="https://github.com/${encodeURIComponent(githubHandle)}" target="_blank" class="btn btn-secondary btn-sm" style="display:flex; align-items:center; gap:6px; font-weight:600;">
                      <span>Open Profile</span> &rarr;
                    </a>
                  </div>
                ` : `
                  <div style="background:var(--c-charcoal-dark); border-radius:8px; padding:16px; text-align:center; border:1px dashed rgba(221,213,205,0.2);">
                    <p class="text-muted text-xs">No GitHub ID linked to this profile yet.</p>
                    ${currentUser && currentUser.id === user.id ? `
                      <button onclick="switchProfileTab('edit')" class="btn btn-secondary btn-sm" style="margin-top:8px;">
                        🐙 + Add GitHub ID in Settings
                      </button>
                    ` : ''}
                  </div>
                `}
              </div>

              <!-- Connected Channels & Social Links -->
              <div class="glass-card" style="display:flex; flex-direction:column; gap:14px;">
                <h3 style="font-size:1.1rem; font-weight:700;">Connected Channels</h3>
                <div style="display:flex; flex-direction:column; gap:12px; font-size:0.85rem;">
                  <div style="display:flex; align-items:center; gap:8px; color:var(--c-sand);">
                    <span>🐙 GitHub:</span>
                    <a href="${user.githubUrl || (user.githubId ? 'https://github.com/' + user.githubId : '#')}" target="_blank" style="color:var(--c-sand); text-decoration:underline;">${user.githubId || user.githubUrl ? escapeHtml(user.githubId || user.githubUrl.replace(/^https?:\/\//, '')) : 'Not set'}</a>
                  </div>
                  <div style="display:flex; align-items:center; gap:8px; color:var(--c-sand);">
                    <span>💼 LinkedIn:</span>
                    <a href="${user.linkedinUrl || '#'}" target="_blank" style="color:var(--c-sand); text-decoration:underline;">${user.linkedinUrl ? escapeHtml(user.linkedinUrl.replace(/^https?:\/\//, '')) : 'Not set'}</a>
                  </div>
                  <div style="display:flex; align-items:center; gap:8px; color:var(--c-sand);">
                    <span>💬 Discord:</span>
                    <span style="color:var(--c-cream);">${escapeHtml(user.discordTag || 'Not set')}</span>
                  </div>
                  <div style="display:flex; align-items:center; gap:8px; color:var(--c-sand);">
                    <span>🐦 Twitter / X:</span>
                    <a href="${user.twitterUrl || '#'}" target="_blank" style="color:var(--c-sand); text-decoration:underline;">${user.twitterUrl ? escapeHtml(user.twitterUrl.replace(/^https?:\/\//, '')) : 'Not set'}</a>
                  </div>
                  <div style="display:flex; align-items:center; gap:8px; color:var(--c-sand);">
                    <span>🌐 Portfolio:</span>
                    <a href="${user.portfolioUrl || '#'}" target="_blank" style="color:var(--c-sand); text-decoration:underline;">${user.portfolioUrl ? escapeHtml(user.portfolioUrl.replace(/^https?:\/\//, '')) : 'Not set'}</a>
                  </div>
                  <div style="display:flex; align-items:center; gap:8px; color:var(--c-sand);">
                    <span>🗓️ Member Since:</span>
                    <span style="color:var(--c-cream);">${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'August 2026'}</span>
                  </div>
                </div>
              </div>

              <!-- Quick Status -->
              <div class="glass-card" style="display:flex; flex-direction:column; gap:8px; background:linear-gradient(135deg, rgba(125,64,71,0.2), rgba(221,213,205,0.1));">
                <div style="font-weight:700; font-size:0.9rem; color:var(--c-cream);">🚀 Open for Collaboration</div>
                <p class="text-muted text-xs">Available for hackathons, research teams, and startup projects.</p>
              </div>
            </div>
          </div>
        `;
      } else if (tab === 'projects') {
        const userProjects = store.projects.filter(p => p.leaderId === user.id || store.members.some(m => m.projectId === p.id && m.userId === user.id));
        
        content.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:16px;">
            <div class="flex justify-between items-center">
              <h3 style="font-weight:700; font-size:1.1rem;">Participating Workspaces (${userProjects.length})</h3>
              ${currentUser && currentUser.id === user.id ? `<button onclick="navigate('new-project')" class="btn btn-primary btn-sm">+ Create Project</button>` : ''}
            </div>

            ${userProjects.length === 0 ? `
              <div class="glass-card" style="text-align:center; padding:40px; color:var(--c-sand);">
                <div>📂</div>
                <div style="margin-top:6px;">No projects created or joined yet.</div>
              </div>
            ` : `
              <div class="grid grid-3">
                ${userProjects.map(p => {
                  const isLeader = p.leaderId === user.id;
                  const memberCount = store.members.filter(m => m.projectId === p.id).length || 1;
                  return `
                    <div class="glass-card flex flex-col justify-between" style="cursor:pointer;" onclick="navigate('project', '${p.id}')">
                      <div>
                        <div class="flex justify-between items-center" style="margin-bottom:8px;">
                          <h4 style="font-weight:600; font-size:1rem; color:var(--c-cream);">${escapeHtml(p.name)}</h4>
                          <span class="badge ${isLeader ? 'badge-indigo' : 'badge-green'}">${isLeader ? 'Leader' : 'Member'}</span>
                        </div>
                        <p class="text-muted text-xs" style="margin-bottom:12px;">${escapeHtml(p.description)}</p>
                        <div style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px;">
                          ${(p.tags || []).map(t => `<span class="badge">${t}</span>`).join('')}
                        </div>
                      </div>
                      <div class="flex justify-between items-center text-xs" style="border-top:1px solid rgba(221,213,205,0.2); padding-top:8px; color:var(--c-sand);">
                        <span>👥 ${memberCount} collaborator${memberCount !== 1 ? 's' : ''}</span>
                        <button class="btn btn-secondary btn-sm" style="padding:4px 8px; font-size:10px;">View &rarr;</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;
      } else if (tab === 'edit') {
        content.innerHTML = `
          <div class="glass-card" style="max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:20px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h3 style="font-size:1.2rem; font-weight:700;">Edit Profile, PFP & Dashboard</h3>
              <span class="badge badge-indigo">Custom Styling</span>
            </div>

            <form onsubmit="handleSaveProfileSettings(event)" style="display:flex; flex-direction:column; gap:18px;">
              
              <!-- 1. Profile Picture (PFP) Customization -->
              <div style="background:var(--c-charcoal-dark); border:1px solid rgba(221,213,205,0.2); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:12px;">
                <label class="text-xs font-bold text-muted" style="text-transform:uppercase;">1. Profile Picture (PFP)</label>
                <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
                  <img id="edit-pfp-preview" src="${user.picture || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(user.name)}`}" style="width:64px; height:64px; border-radius:18px; object-fit:cover; border:2px solid var(--c-burgundy);" />
                  <div style="display:flex; flex-direction:column; gap:8px; flex:1;">
                    <input type="file" id="edit-pfp-file" accept="image/*" onchange="handlePfpUpload(event)" style="display:none;" />
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                      <button type="button" onclick="document.getElementById('edit-pfp-file').click()" class="btn btn-secondary btn-sm">📁 Upload Custom Image</button>
                      <button type="button" onclick="setAvatarPreset('bottts')" class="btn btn-secondary btn-sm">🤖 Bot</button>
                      <button type="button" onclick="setAvatarPreset('avataaars')" class="btn btn-secondary btn-sm">🧑‍💻 Hacker</button>
                      <button type="button" onclick="setAvatarPreset('shapes')" class="btn btn-secondary btn-sm">🎨 Abstract</button>
                    </div>
                    <input id="edit-picture" value="${escapeHtml(user.picture || '')}" placeholder="Or paste image URL (https://...)" style="font-size:11px;" />
                  </div>
                </div>
              </div>

              <!-- 2. Dashboard Background (Cover Theme) -->
              <div style="background:var(--c-charcoal-dark); border:1px solid rgba(221,213,205,0.2); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:12px;">
                <label class="text-xs font-bold text-muted" style="text-transform:uppercase;">2. Dashboard Cover Background</label>
                <div style="display:flex; flex-direction:column; gap:8px;">
                  <input type="file" id="edit-cover-file" accept="image/*" onchange="handleCoverUpload(event)" style="display:none;" />
                  <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button type="button" onclick="document.getElementById('edit-cover-file').click()" class="btn btn-secondary btn-sm">📁 Upload Custom Banner</button>
                    <button type="button" onclick="setCoverTheme('linear-gradient(135deg, #2E2E2E 0%, #3e282b 40%, #7D4047 100%)')" class="btn btn-secondary btn-sm" style="background:linear-gradient(135deg, #2E2E2E, #7D4047);">Burgundy Velvet</button>
                    <button type="button" onclick="setCoverTheme('linear-gradient(135deg, #18181b 0%, #7f1d1d 100%)')" class="btn btn-secondary btn-sm" style="background:linear-gradient(135deg, #18181b, #7f1d1d);">Obsidian Crimson</button>
                    <button type="button" onclick="setCoverTheme('linear-gradient(135deg, #2E2E2E 0%, #44403c 50%, #7D4047 100%)')" class="btn btn-secondary btn-sm" style="background:linear-gradient(135deg, #2E2E2E, #44403c);">Sand Dusk</button>
                  </div>
                  <input id="edit-cover-bg" value="${escapeHtml(user.coverBg || '')}" placeholder="Or paste background CSS / image URL (e.g. url('https://...'))" style="font-size:11px;" />
                </div>
              </div>

              <!-- 3. Identity & About -->
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div>
                  <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Display Name *</label>
                  <input id="edit-name" value="${escapeHtml(user.name || '')}" required />
                </div>
                <div>
                  <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Headline / Title</label>
                  <input id="edit-headline" value="${escapeHtml(user.headline || '')}" placeholder="e.g. AI Researcher & Full-Stack Hacker" />
                </div>
              </div>

              <div>
                <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">School / College / Organization</label>
                <input id="edit-school" value="${escapeHtml(user.school || '')}" placeholder="e.g. Dayananda Sagar College of Engineering" />
              </div>

              <div>
                <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">About / Background Bio</label>
                <textarea id="edit-bio" rows="3" placeholder="Tell collaborators about your interests, past projects, and goals...">${escapeHtml(user.bio || '')}</textarea>
              </div>

              <!-- 4. Skills & Interests -->
              <div>
                <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Skills & Technologies (comma-separated)</label>
                <input id="edit-skills" value="${escapeHtml((user.skills || []).join(', '))}" placeholder="React, Node.js, Python, ROS2, PyTorch, Embedded C, Figma" />
              </div>

              <div>
                <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Interests & Focus Areas (comma-separated)</label>
                <input id="edit-interests" value="${escapeHtml((user.interests || []).join(', '))}" placeholder="Autonomous Vehicles, Hackathons, Web3, SpaceTech, Computer Vision" />
              </div>

              <!-- 5. 🐙 Dedicated GitHub ID & Connected Channels -->
              <div style="background:var(--c-charcoal-dark); border:1px solid rgba(221,213,205,0.2); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:12px;">
                <label class="text-xs font-bold text-muted" style="text-transform:uppercase;">Connected Channels & Profiles</label>
                
                <div style="background:rgba(125,64,71,0.15); border:1px solid rgba(125,64,71,0.4); border-radius:8px; padding:12px;">
                  <label class="text-xs font-bold" style="display:block; margin-bottom:4px; color:var(--c-cream);">🐙 GitHub ID / Username</label>
                  <input id="edit-github-id" value="${escapeHtml(user.githubId || (user.githubUrl ? user.githubUrl.replace(/^https?:\/\/github\.com\//, '').replace(/^@/, '') : ''))}" placeholder="e.g. Omkar-G-20 (or your GitHub handle)" style="background:var(--c-charcoal); border:1px solid rgba(221,213,205,0.3);" />
                  <span class="text-muted text-xs" style="margin-top:4px; display:block;">Your GitHub link will automatically resolve to <code>https://github.com/your-username</code></span>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                  <div>
                    <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">💼 LinkedIn URL</label>
                    <input id="edit-linkedin" value="${escapeHtml(user.linkedinUrl || '')}" placeholder="https://linkedin.com/in/yourhandle" />
                  </div>
                  <div>
                    <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">💬 Discord / Telegram Tag</label>
                    <input id="edit-discord" value="${escapeHtml(user.discordTag || '')}" placeholder="@username or user#1234" />
                  </div>
                  <div>
                    <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">🐦 Twitter / X Profile URL</label>
                    <input id="edit-twitter" value="${escapeHtml(user.twitterUrl || '')}" placeholder="https://x.com/yourhandle" />
                  </div>
                  <div>
                    <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">🌐 Personal Portfolio / Website URL</label>
                    <input id="edit-portfolio" value="${escapeHtml(user.portfolioUrl || '')}" placeholder="https://yourportfolio.dev" />
                  </div>
                </div>
              </div>

              <div style="display:flex; gap:12px; margin-top:8px;">
                <button type="button" onclick="switchProfileTab('overview')" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary" style="flex:1;">💾 Save & Sync Profile Changes</button>
              </div>
            </form>
          </div>
        `;
      }
    }

    function setAvatarPreset(style) {
      if (!currentUser) return;
      const seed = encodeURIComponent(currentUser.name || 'builder');
      const url = `https://api.dicebear.com/7.x/${style}/svg?seed=${seed}`;
      const input = document.getElementById('edit-picture');
      const preview = document.getElementById('edit-pfp-preview');
      if (input) input.value = url;
      if (preview) preview.src = url;
      showToast("Avatar preset selected!");
    }

    function setCoverTheme(gradient) {
      const input = document.getElementById('edit-cover-bg');
      if (input) input.value = gradient;
      showToast("Cover theme selected!");
    }

    async function handleSaveProfileSettings(e) {
      e.preventDefault();
      if (!currentUser) return;

      const name = censorProfanity(document.getElementById('edit-name').value.trim());
      const headline = censorProfanity(document.getElementById('edit-headline').value.trim());
      const school = censorProfanity(document.getElementById('edit-school').value.trim());
      const bio = censorProfanity(document.getElementById('edit-bio').value.trim());
      const picture = document.getElementById('edit-picture').value.trim();
      const coverBg = document.getElementById('edit-cover-bg').value.trim();

      const skillsRaw = document.getElementById('edit-skills').value.trim();
      const interestsRaw = document.getElementById('edit-interests').value.trim();

      const rawGithub = document.getElementById('edit-github-id') ? document.getElementById('edit-github-id').value.trim() : '';
      const githubId = rawGithub.replace(/^https?:\/\/github\.com\//, '').replace(/^@/, '');
      const githubUrl = githubId ? `https://github.com/${githubId}` : '';

      const linkedinUrl = document.getElementById('edit-linkedin').value.trim();
      const discordTag = document.getElementById('edit-discord').value.trim();
      const twitterUrl = document.getElementById('edit-twitter').value.trim();
      const portfolioUrl = document.getElementById('edit-portfolio').value.trim();

      const skills = skillsRaw ? skillsRaw.split(',').map(s => censorProfanity(s.trim())).filter(Boolean) : [];
      const interests = interestsRaw ? interestsRaw.split(',').map(i => censorProfanity(i.trim())).filter(Boolean) : [];

      currentUser.name = name;
      currentUser.headline = headline;
      currentUser.school = school;
      currentUser.bio = bio;
      currentUser.picture = picture || currentUser.picture;
      currentUser.coverBg = coverBg || currentUser.coverBg;
      currentUser.skills = skills;
      currentUser.interests = interests;
      currentUser.githubId = githubId;
      currentUser.githubUrl = githubUrl;
      currentUser.linkedinUrl = linkedinUrl;
      currentUser.discordTag = discordTag;
      currentUser.twitterUrl = twitterUrl;
      currentUser.portfolioUrl = portfolioUrl;

      const u = store.users.find(x => x.id === currentUser.id);
      if (u) {
        Object.assign(u, {
          name, headline, school, bio, picture: currentUser.picture,
          coverBg: currentUser.coverBg, skills, interests,
          githubId, githubUrl, linkedinUrl, discordTag, twitterUrl, portfolioUrl
        });
      }

      await saveState();
      renderNavAuth();
      showToast('Profile, GitHub ID & Channels saved live!');
      renderProfileView(currentUser.id);
    }

    function copyProfileLink(userId) {
      const url = window.location.origin + window.location.pathname + '#profile/' + userId;
      navigator.clipboard.writeText(url).then(() => {
        showToast('Profile link copied to clipboard!');
      }).catch(() => {
        showToast('Profile ID: ' + userId);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    init();
  </script>
</body>
</html>
