<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronnect — Discover Teams & Build Projects Together</title>
  <meta name="description" content="Pronnect is a modern platform to discover project teammates, manage Kanban tasks, chat in real-time, and ship collaborative projects.">
  
  <!-- Google Fonts: Montserrat (Headings) & Raleway (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Gun.js Real-Time Decentralized Mesh Sync -->
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>

  <style>
    :root {
      --c-cream: #F1ECE6;
      --c-sand: #DDD5CD;
      --c-burgundy: #7D4047;
      --c-charcoal: #2E2E2E;
      --c-charcoal-card: #383434;
      --c-charcoal-dark: #222020;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background-color: var(--c-charcoal); color: var(--c-cream); font-family: 'Raleway', sans-serif; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    h1, h2, h3, h4, h5, h6, .font-heading, .btn, .service-nav-btn { font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }

    /* Layout & Container */
    .container { max-width: 1200px; margin: 0 auto; width: 100%; padding: 24px 16px; flex: 1; }
    
    /* Logic Theme Sticky Header */
    nav { background: rgba(34, 32, 32, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(221, 213, 205, 0.2); position: sticky; top: 0; z-index: 100; padding: 12px 24px; }
    .nav-inner { max-width: 1240px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .nav-links { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .nav-item-link { color: var(--c-sand); text-decoration: none; font-size: 0.78rem; font-weight: 700; font-family: 'Montserrat', sans-serif; padding: 8px 12px; border-radius: 6px; transition: all 0.2s; text-transform: uppercase; }
    .nav-item-link:hover, .nav-item-link.active { color: var(--c-cream); background: rgba(125, 64, 71, 0.4); }
    
    /* Glassmorphism & Cards */
    .glass-card { background: rgba(56, 52, 52, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(221, 213, 205, 0.22); border-radius: 12px; padding: 24px; transition: transform 0.2s, border-color 0.2s; color: var(--c-cream); }
    .glass-card:hover { border-color: var(--c-burgundy); }
    .glass-pill { background: rgba(46, 46, 46, 0.85); border: 1px solid rgba(221, 213, 205, 0.35); border-radius: 9999px; }
    
    /* Grids & Flex */
    .grid { display: grid; gap: 18px; }
    .grid-3 { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .grid-kanban { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    
    /* Typography & Visuals */
    .gradient-text { background: linear-gradient(135deg, var(--c-cream) 0%, var(--c-sand) 40%, var(--c-burgundy) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
    .hero-glow { position: absolute; top: -120px; left: 50%; transform: translateX(-50%); width: 600px; height: 350px; background: radial-gradient(circle, rgba(125, 64, 71, 0.4) 0%, rgba(221, 213, 205, 0.15) 50%, transparent 70%); filter: blur(60px); pointer-events: none; z-index: 0; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .text-muted { color: var(--c-sand); opacity: 0.85; }
    
    /* Badges */
    .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; font-family: 'Montserrat', sans-serif; background: var(--c-charcoal); border: 1px solid rgba(221, 213, 205, 0.3); color: var(--c-sand); }
    .badge-indigo, .badge-accent { background: rgba(125, 64, 71, 0.25); border-color: rgba(125, 64, 71, 0.6); color: var(--c-cream); }
    .badge-green { background: rgba(125, 64, 71, 0.2); border-color: rgba(221, 213, 205, 0.4); color: var(--c-sand); }
    .badge-yellow { background: rgba(221, 213, 205, 0.15); border-color: rgba(221, 213, 205, 0.4); color: var(--c-sand); }
    
    /* Forms & Buttons */
    input, textarea, select { width: 100%; padding: 12px 14px; background: var(--c-charcoal-dark); border: 1px solid rgba(221, 213, 205, 0.25); border-radius: 8px; color: var(--c-cream); font-family: 'Raleway', sans-serif; font-size: 0.875rem; outline: none; transition: border-color 0.2s; }
    input:focus, textarea:focus, select:focus { border-color: var(--c-burgundy); }
    button { cursor: pointer; border: none; border-radius: 8px; font-weight: 700; font-size: 0.82rem; transition: all 0.2s; }
    .btn { padding: 10px 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: var(--c-burgundy); color: var(--c-cream); box-shadow: 0 4px 14px rgba(125, 64, 71, 0.4); }
    .btn-primary:hover { background: #964e56; transform: translateY(-1px); }
    .btn-secondary { background: var(--c-charcoal-card); color: var(--c-cream); border: 1px solid rgba(221, 213, 205, 0.3); }
    .btn-secondary:hover { background: #444040; border-color: var(--c-sand); }
    .btn-sm { padding: 6px 14px; font-size: 0.75rem; }
    
    /* Chat Layout & Presence Sidebar */
    .chat-layout { display: grid; grid-template-columns: 1fr 240px; gap: 16px; }
    @media (max-width: 768px) { .chat-layout { grid-template-columns: 1fr; } }
    .chat-box { height: 440px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--c-charcoal-dark); border: 1px solid rgba(221, 213, 205, 0.15); border-radius: 8px; }
    .msg-group { display: flex; flex-direction: column; position: relative; }
    .msg-bubble { padding: 8px 14px; border-radius: 16px; max-width: 80%; font-size: 0.875rem; word-break: break-word; }
    .msg-me { align-self: flex-end; background: var(--c-burgundy); color: var(--c-cream); border-bottom-right-radius: 2px; }
    .msg-other { align-self: flex-start; background: var(--c-charcoal-card); color: var(--c-cream); border: 1px solid rgba(221, 213, 205, 0.2); border-bottom-left-radius: 2px; }
    
    /* Message Hover Action Toolbar */
    .msg-hover-actions {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      transform: translateY(2px);
    }
    .msg-group:hover .msg-hover-actions,
    .msg-group:focus-within .msg-hover-actions {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    
    /* Online indicator pulse */
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-online { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
    .status-offline { background: var(--c-sand); opacity: 0.5; }
    
    /* Typing Indicator Animation */
    .typing-indicator { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; font-size: 0.75rem; color: var(--c-sand); font-style: italic; }
    .typing-dot { width: 4px; height: 4px; background: var(--c-sand); border-radius: 50%; animation: blink 1.2s infinite ease-in-out; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }
    
    /* Progress Track */
    .progress-track { width: 100%; height: 10px; background: var(--c-charcoal-dark); border-radius: 9999px; overflow: hidden; border: 1px solid rgba(221, 213, 205, 0.2); }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--c-burgundy), var(--c-sand)); transition: width 0.4s; }
    
    /* Toast */
    #toast-root { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { padding: 12px 18px; border-radius: 8px; font-size: 0.875rem; background: var(--c-charcoal-dark); border: 1px solid var(--c-burgundy); color: var(--c-cream); box-shadow: 0 10px 25px rgba(0,0,0,0.5); pointer-events: auto; }
    .toast-err { border-color: var(--c-burgundy); background: #451b1f; }

    /* Bento Grid Features */
    .bento-card { background: linear-gradient(180deg, rgba(56, 52, 52, 0.5) 0%, rgba(46, 46, 46, 0.7) 100%); border: 1px solid rgba(221, 213, 205, 0.25); border-radius: 16px; padding: 28px; }

    /* In-App Glassmorphism Modal System */
    .modal-overlay { position: fixed; inset: 0; background: rgba(34, 32, 32, 0.85); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: var(--c-charcoal); border: 1px solid rgba(125, 64, 71, 0.6); border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 30px rgba(125, 64, 71, 0.25); transform: scale(0.95); transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden; color: var(--c-cream); }
    .modal-overlay.active .modal-card { transform: scale(1); }
    .modal-header { padding: 18px 24px; border-bottom: 1px solid rgba(221, 213, 205, 0.2); display: flex; justify-content: space-between; align-items: center; background: rgba(56, 52, 52, 0.4); }
    .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid rgba(221, 213, 205, 0.2); display: flex; justify-content: flex-end; gap: 10px; background: rgba(46, 46, 46, 0.7); }
    .modal-close-btn { background: transparent; border: none; color: var(--c-sand); font-size: 1.2rem; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .modal-close-btn:hover { background: var(--c-charcoal-card); color: var(--c-cream); }

    /* Input with action toggle */
    .input-with-btn { display: flex; position: relative; }
    .input-with-btn input { padding-right: 42px; }
    .input-toggle-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; font-size: 1rem; color: var(--c-sand); padding: 4px; border-radius: 4px; cursor: pointer; }
    .input-toggle-btn:hover { color: var(--c-cream); }

    /* Logic Theme Sections Styling */
    .section-title { text-align: center; margin-bottom: 32px; }
    .section-title h2, .section-title h3 { font-size: clamp(1.8rem, 3.5vw, 2.4rem); font-weight: 800; color: var(--c-cream); letter-spacing: 0.05em; }
    .section-separator { width: 50px; height: 3px; background: var(--c-burgundy); margin: 10px auto 14px; border-radius: 2px; }
    
    .service-nav-btn { background: var(--c-charcoal-dark); border: 1px solid rgba(221,213,205,0.2); color: var(--c-sand); padding: 16px 20px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s ease; flex: 1; min-width: 140px; }
    .service-nav-btn.active, .service-nav-btn:hover { background: var(--c-burgundy); color: var(--c-cream); border-color: var(--c-burgundy); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(125,64,71,0.35); }

    .accordion-header { background: var(--c-charcoal-dark); border: 1px solid rgba(221,213,205,0.2); padding: 14px 18px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-family: 'Montserrat', sans-serif; font-size: 0.85rem; color: var(--c-cream); transition: all 0.2s; }
    .accordion-header:hover { border-color: var(--c-burgundy); }
    .accordion-body { background: rgba(0,0,0,0.2); border: 1px solid rgba(221,213,205,0.1); border-top: none; border-radius: 0 0 10px 10px; padding: 14px 18px; color: var(--c-sand); font-size: 0.875rem; line-height: 1.6; display: none; }
    .accordion-body.active { display: block; }

    .stat-card { background: rgba(34,32,32,0.85); border: 1px solid rgba(221,213,205,0.2); border-radius: 12px; padding: 30px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: transform 0.2s, border-color 0.2s; }
    .stat-card:hover { transform: translateY(-4px); border-color: var(--c-burgundy); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .stat-number { font-size: 2.8rem; font-weight: 900; font-family: 'Montserrat', sans-serif; color: var(--c-cream); line-height: 1; }

    .filter-tab-btn { background: var(--c-charcoal-dark); border: 1px solid rgba(221,213,205,0.25); color: var(--c-sand); padding: 8px 18px; border-radius: 9999px; font-size: 0.78rem; font-weight: 700; font-family: 'Montserrat', sans-serif; cursor: pointer; transition: all 0.2s; }
    .filter-tab-btn.active, .filter-tab-btn:hover { background: var(--c-burgundy); color: var(--c-cream); border-color: var(--c-burgundy); }

    /* Team Card with Hover Overlay */
    .team-card { position: relative; border-radius: 12px; overflow: hidden; background: var(--c-charcoal-dark); border: 1px solid rgba(221,213,205,0.2); transition: transform 0.2s; }
    .team-card:hover { transform: translateY(-4px); border-color: var(--c-burgundy); }
    .team-img { width: 100%; height: 260px; object-fit: cover; display: block; }
    .team-info { padding: 16px; text-align: center; }
    .team-name { font-size: 1rem; font-weight: 800; color: var(--c-cream); }
    .team-role { font-size: 0.75rem; color: var(--c-sand); margin-top: 2px; }
    .team-socials { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
    .team-socials a { width: 30px; height: 30px; border-radius: 50%; background: rgba(221,213,205,0.1); display: flex; align-items: center; justify-content: center; color: var(--c-cream); text-decoration: none; font-size: 0.8rem; transition: background 0.2s; }
    .team-socials a:hover { background: var(--c-burgundy); }

    /* Skillbar */
    .skillbar-container { display: flex; flex-direction: column; gap: 14px; }
    .skillbar-item { display: flex; flex-direction: column; gap: 6px; }
    .skillbar-title { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.8rem; }
    .skillbar-track { height: 8px; background: rgba(0,0,0,0.4); border-radius: 9999px; overflow: hidden; border: 1px solid rgba(221,213,205,0.15); }
    .skillbar-fill { height: 100%; background: linear-gradient(90deg, var(--c-sand), var(--c-burgundy)); border-radius: 9999px; }
  </style>
</head>


<body>
  <!-- LOGIC THEME NAVBAR -->
  <nav id="main-nav">
    <div class="nav-inner">
      <div style="display:flex; align-items:center; gap:16px;">
        <div onclick="navigate('home')" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <div style="width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg, var(--c-cream), var(--c-burgundy)); display:flex; align-items:center; justify-content:center; font-weight:bold; color:var(--c-charcoal); font-size:1.1rem; box-shadow:0 0 16px rgba(125,64,71,0.4);">P</div>
          <span class="gradient-text" style="font-size:1.3rem; font-family:'Montserrat', sans-serif;">Pronnect</span>
        </div>
        <div class="nav-links">
          <a href="#home" onclick="scrollToSection('home')" class="nav-item-link active">Home</a>
          <a href="#service" onclick="scrollToSection('service')" class="nav-item-link">Service</a>
          <a href="#features" onclick="scrollToSection('features')" class="nav-item-link">Featured</a>
          <a href="#about" onclick="scrollToSection('about')" class="nav-item-link">About</a>
          <a href="#team" onclick="scrollToSection('team')" class="nav-item-link">Teams</a>
          <a href="#portfolio" onclick="scrollToSection('portfolio')" class="nav-item-link">Works</a>
          <a href="#testimonial" onclick="scrollToSection('testimonial')" class="nav-item-link">Testimonial</a>
          <a href="#contact" onclick="scrollToSection('contact')" class="nav-item-link">Contact</a>
        </div>
      </div>
      <div id="nav-auth" style="display:flex; align-items:center; gap:10px;"></div>
    </div>
  </nav>

  <!-- MAIN APP ROOT -->
  <main class="container" id="app-root"></main>

  <!-- IN-APP MODAL ROOT -->
  <div id="app-modal" class="modal-overlay" onclick="handleModalOverlayClick(event)">
    <div class="modal-card" id="app-modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size:1.1rem; font-weight:700; color:#f8fafc;">Modal Title</h3>
        <button onclick="closeModal()" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast-root"></div>

  <script>
    // --- MULTI-PEER REAL-TIME GLOBAL MESH (P2P + WEBSOCKET RELAYS + LOCALSTORAGE) ---
    const LOCAL_CACHE_KEY = "pronnect_session_v4";
    const MESH_CHANNEL_NAME = "pronnect_mesh_sync_v4";

    let store = {
      users: [],
      projects: [],
      members: [],
      joinRequests: [],
      tasks: [],
      polls: [],
      pollVotes: [],
      messages: [],
      media: [],
      presence: {},
      typing: {}
    };

    let currentUser = null;
    let currentView = 'home';
    let activeProjectId = null;
    let activeProjectTab = 'chat';
    let typingTimer = null;
    let pendingAuth = null; // { type: 'signup' | 'login', data: {...}, otp: '123456', expiresAt: timestamp }
    let otpResendTimer = null;
    let domainTags = ["AI/ML", "Web Dev", "Mobile", "Embedded Systems", "Robotics", "IoT", "Cybersecurity", "Data Science", "Research"];

    // Restore cached session
    try {
      const cached = localStorage.getItem(LOCAL_CACHE_KEY);
      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed.currentUser) currentUser = parsed.currentUser;
        if (parsed.store) store = { ...store, ...parsed.store };
      }
    } catch (e) {}

    // Initialize Gun.js Realtime Mesh
    let gunMesh = null;
    try {
      if (typeof Gun !== 'undefined') {
        gunMesh = Gun([
          'https://gun-manhattan.herokuapp.com/gun',
          'https://relay.peer.ooo/gun',
          'https://peer.wallarm.com/gun'
        ]).get('pronnect_global_mesh_store_v4');

        gunMesh.on((data) => {
          if (data && data.payload) {
            try {
              const incoming = JSON.parse(data.payload);
              if (incoming && typeof incoming === 'object') {
                mergeIncomingStore(incoming);
              }
            } catch (err) {}
          }
        });
      }
    } catch (e) {
      console.warn("Gun.js mesh init fallback:", e);
    }

    // Cross-tab broadcast channel
    let meshChannel = null;
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        meshChannel = new BroadcastChannel(MESH_CHANNEL_NAME);
        meshChannel.onmessage = (e) => {
          if (e.data && e.data.store) {
            mergeIncomingStore(e.data.store);
          }
        };
      }
    } catch (e) {}

    function showToast(msg, isError = false) {
      const root = document.getElementById('toast-root');
      const toast = document.createElement('div');
      toast.className = 'toast ' + (isError ? 'toast-err' : '');
      toast.innerHTML = (isError ? '⚠️ ' : '✅ ') + msg;
      root.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3500);
    }

    // --- IN-PAGE MODAL CONTROLS (NO BROWSER POPUPS) ---
    function openModal(title, bodyHTML) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerHTML = bodyHTML;
      document.getElementById('app-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('app-modal').classList.remove('active');
      if (otpResendTimer) {
        clearInterval(otpResendTimer);
        otpResendTimer = null;
      }
    }

    function handleModalOverlayClick(e) {
      if (e.target.id === 'app-modal') closeModal();
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = '🙈';
      } else {
        input.type = 'password';
        btn.innerText = '👁️';
      }
    }

    // Merge incoming remote store with local state
    function mergeIncomingStore(incoming) {
      let changed = false;

      // Merge users
      if (Array.isArray(incoming.users)) {
        incoming.users.forEach(u => {
          const idx = store.users.findIndex(x => x.id === u.id || (x.email && u.email && x.email.toLowerCase() === u.email.toLowerCase()));
          if (idx === -1) {
            store.users.push(u);
            changed = true;
          } else {
            store.users[idx] = { ...store.users[idx], ...u };
          }
        });
      }

      // Merge projects
      if (Array.isArray(incoming.projects)) {
        incoming.projects.forEach(p => {
          const idx = store.projects.findIndex(x => x.id === p.id);
          if (idx === -1) {
            store.projects.push(p);
            changed = true;
          } else {
            store.projects[idx] = { ...store.projects[idx], ...p };
          }
        });
      }

      // Merge members
      if (Array.isArray(incoming.members)) {
        incoming.members.forEach(m => {
          if (!store.members.some(x => x.projectId === m.projectId && x.userId === m.userId)) {
            store.members.push(m);
            changed = true;
          }
        });
      }

      // Merge join requests
      if (Array.isArray(incoming.joinRequests)) {
        incoming.joinRequests.forEach(r => {
          const idx = store.joinRequests.findIndex(x => x.id === r.id);
          if (idx === -1) {
            store.joinRequests.push(r);
            changed = true;
          } else {
            store.joinRequests[idx] = r;
          }
        });
      }

      // Merge tasks
      if (Array.isArray(incoming.tasks)) {
        incoming.tasks.forEach(t => {
          const idx = store.tasks.findIndex(x => x.id === t.id);
          if (idx === -1) {
            store.tasks.push(t);
            changed = true;
          } else {
            store.tasks[idx] = t;
          }
        });
      }

      // Merge polls & votes
      if (Array.isArray(incoming.polls)) {
        incoming.polls.forEach(p => {
          if (!store.polls.some(x => x.id === p.id)) {
            store.polls.push(p);
            changed = true;
          }
        });
      }
      if (Array.isArray(incoming.pollVotes)) {
        store.pollVotes = incoming.pollVotes;
      }

      // Merge messages
      if (Array.isArray(incoming.messages)) {
        incoming.messages.forEach(m => {
          if (!store.messages.some(x => x.id === m.id)) {
            store.messages.push(m);
            changed = true;
          }
        });
      }

      // Merge media
      if (Array.isArray(incoming.media)) {
        incoming.media.forEach(m => {
          if (!store.media.some(x => x.id === m.id)) {
            store.media.push(m);
            changed = true;
          }
        });
      }

      // Merge presence
      if (incoming.presence && typeof incoming.presence === 'object') {
        store.presence = { ...store.presence, ...incoming.presence };
      }

      if (currentUser) {
        store.presence[currentUser.id] = Date.now();
      }

      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ store, currentUser }));

      // Refresh current view
      if (currentView === 'explore') loadProjects();
      if (currentView === 'global-chat') {
        loadGlobalChat();
        renderPresenceList('global-presence-list', null);
      }
      if (currentView === 'project' && activeProjectId) {
        if (activeProjectTab === 'chat') {
          loadProjectChat(activeProjectId);
          renderPresenceList('project-presence-list', activeProjectId);
        }
        if (activeProjectTab === 'tasks') loadProjectTasks(activeProjectId);
        if (activeProjectTab === 'polls') loadProjectPolls(activeProjectId);
        if (activeProjectTab === 'media') loadProjectMedia(activeProjectId);
        if (activeProjectTab === 'progress') loadProjectProgress(activeProjectId);
        if (activeProjectTab === 'requests') loadProjectRequests(activeProjectId);
      }
    }

    // Save and broadcast state to all peers
    async function saveState() {
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ store, currentUser }));

      // 1. Broadcast over Gun.js mesh
      try {
        if (gunMesh) {
          gunMesh.put({ payload: JSON.stringify(store), timestamp: Date.now() });
        }
      } catch (e) {}

      // 2. Broadcast across local browser tabs
      try {
        if (meshChannel) {
          meshChannel.postMessage({ store });
        }
      } catch (e) {}

      // 3. Fallback Node server sync if hosted
      if (window.location.protocol.startsWith('http') && window.location.hostname !== 'omkar-g-20.github.io') {
        try {
          await fetch('/api/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(store)
          });
        } catch (e) {}
      }
    }

    // Heartbeat for online presence
    setInterval(() => {
      if (currentUser) {
        store.presence[currentUser.id] = Date.now();
        saveState();
      }
    }, 4000);

    // --- STEP 1: INITIATE SIGNUP OTP ---
    function initiateSignupOTP(e) {
      e.preventDefault();
      const name = document.getElementById('auth-reg-name').value.trim();
      const email = document.getElementById('auth-reg-email').value.trim().toLowerCase();
      const school = document.getElementById('auth-reg-school').value.trim();
      const password = document.getElementById('auth-reg-password').value;
      const confirmPassword = document.getElementById('auth-reg-confirm-password').value;

      if (!name || !email || !school || !password) {
        showToast("Please fill in all required fields", true);
        return;
      }

      if (!isValidEmail(email)) {
        showToast("Please enter a valid email address (e.g. name@gmail.com)", true);
        return;
      }

      if (password.length < 4) {
        showToast("Password must be at least 4 characters long", true);
        return;
      }

      if (password !== confirmPassword) {
        showToast("Passwords do not match. Please verify!", true);
        return;
      }

      // Generate 6-Digit Secure OTP
      const otpCode = Math.floor(100000 + Math.random() * 900000).toString();
      pendingAuth = {
        type: 'signup',
        data: { name, email, school, password },
        otp: otpCode,
        expiresAt: Date.now() + 5 * 60 * 1000 // 5 minutes
      };

      showOtpVerificationModal();
    }

    // --- STEP 2: INITIATE LOGIN OTP ---
    function initiateLoginOTP(e) {
      e.preventDefault();
      const email = document.getElementById('auth-login-email').value.trim().toLowerCase();
      const password = document.getElementById('auth-login-password').value;

      if (!email || !password) {
        showToast("Please enter both email and password", true);
        return;
      }

      if (!isValidEmail(email)) {
        showToast("Please enter a valid email address (e.g. name@gmail.com)", true);
        return;
      }

      const existing = store.users.find(u => (u.email && u.email.toLowerCase() === email) || (u.name && u.name.toLowerCase() === email));

      if (existing) {
        if (existing.password && existing.password !== password) {
          showToast("Incorrect password. Please try again!", true);
          return;
        }
      }

      // Generate 6-Digit Secure OTP
      const otpCode = Math.floor(100000 + Math.random() * 900000).toString();
      pendingAuth = {
        type: 'login',
        data: {
          name: existing ? existing.name : email.split('@')[0],
          email: existing ? existing.email : email,
          school: existing ? existing.school : "Member",
          password: password,
          existingUser: existing
        },
        otp: otpCode,
        expiresAt: Date.now() + 5 * 60 * 1000
      };

      showOtpVerificationModal();
    }

    function startOTPTimer() {
      if (otpResendTimer) clearInterval(otpResendTimer);
      let secondsLeft = 300; // 5 minutes

      otpResendTimer = setInterval(() => {
        secondsLeft--;
        const label = document.getElementById('otp-timer-label');
        if (label) {
          const mins = Math.floor(secondsLeft / 60);
          const secs = secondsLeft % 60;
          label.innerText = `Code expires in: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        if (secondsLeft <= 0) {
          clearInterval(otpResendTimer);
          if (pendingAuth) pendingAuth.otp = null;
          if (label) label.innerText = "Code expired. Please click Resend!";
        }
      }, 1000);
    }

    function resendOTP() {
      if (!pendingAuth) return;
      const newOtp = Math.floor(100000 + Math.random() * 900000).toString();
      pendingAuth.otp = newOtp;
      pendingAuth.expiresAt = Date.now() + 5 * 60 * 1000;
      showOtpVerificationModal();
      showToast("New OTP generated: " + newOtp);
    }

    // --- STEP 4: VERIFY OTP AND FINALIZE LOGIN/REGISTRATION ---
    function handleVerifyOTPSubmit(e) {
      e.preventDefault();
      if (!pendingAuth) return;

      const enteredOTP = document.getElementById('modal-otp-input').value.trim();

      if (Date.now() > pendingAuth.expiresAt) {
        showToast("OTP code has expired. Please click Resend!", true);
        return;
      }

      if (enteredOTP !== pendingAuth.otp) {
        showToast("Invalid OTP code. Please check and re-enter!", true);
        return;
      }

      // OTP Verified Successfully!
      if (otpResendTimer) {
        clearInterval(otpResendTimer);
        otpResendTimer = null;
      }

      const { type, data } = pendingAuth;
      let user = null;

      if (type === 'signup') {
        const existing = store.users.find(u => u.email.toLowerCase() === data.email.toLowerCase());
        if (existing) {
          existing.name = data.name;
          existing.school = data.school;
          existing.password = data.password;
          user = existing;
        } else {
          user = {
            id: "u_" + Date.now() + "_" + Math.random().toString(36).substring(2, 6),
            name: data.name,
            email: data.email,
            school: data.school,
            password: data.password,
            headline: `Builder & Student at ${data.school}`,
            bio: "Collaborating and building innovative projects with the Pronnect community.",
            skills: ["Full-Stack", "AI/ML"],
            picture: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(data.name)}`,
            createdAt: new Date().toISOString()
          };
          store.users.push(user);
        }
      } else {
        // Login
        if (data.existingUser) {
          user = data.existingUser;
          if (!user.password) user.password = data.password;
        } else {
          // New quick-register
          user = {
            id: "u_" + Date.now() + "_" + Math.random().toString(36).substring(2, 6),
            name: data.name,
            email: data.email,
            school: data.school || "Member",
            password: data.password,
            headline: "Collaborator & Builder",
            bio: "Building innovative projects with the Pronnect community.",
            skills: ["Full-Stack", "AI/ML"],
            picture: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(data.name)}`,
            createdAt: new Date().toISOString()
          };
          store.users.push(user);
        }
      }

      currentUser = user;
      store.presence[user.id] = Date.now();
      pendingAuth = null;

      saveState();
      closeModal();
      renderNavAuth();
      showToast("Security verified! Welcome, " + user.name + "!");
      navigate('explore');
    }

    // --- 1. EXPLORE PROJECTS ---
    function renderExploreView() {
      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:20px;">
          <div class="flex justify-between items-center" style="flex-wrap:wrap; gap:12px;">
            <div>
              <h1 style="font-size:1.75rem; font-weight:bold;">Explore Projects</h1>
              <p class="text-muted text-sm">Discover public projects or unlock private team projects</p>
            </div>
            <div style="display:flex; gap:8px;">
              <button onclick="promptJoinPrivateProject()" class="btn btn-secondary">🔑 Unlock Private Project</button>
              <button onclick="navigate('new-project')" class="btn btn-primary">+ Create Project</button>
            </div>
          </div>

          <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
              <input id="search-input" oninput="loadProjects()" placeholder="Search projects by name..." style="flex:1; min-width:200px;" />
              <input id="school-input" oninput="loadProjects()" placeholder="Filter by school / college..." style="flex:1; min-width:200px;" />
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;" id="tag-filters">
              <button onclick="selectTag('')" id="tag-btn-all" class="badge badge-indigo" style="cursor:pointer; padding:6px 12px;">All Tags</button>
              ${domainTags.map(t => `<button onclick="selectTag('${t}')" id="tag-btn-${t.replace(/[^a-zA-Z]/g, '')}" class="badge" style="cursor:pointer; padding:6px 12px;">${t}</button>`).join('')}
            </div>
          </div>

          <div id="projects-grid" class="grid grid-3"></div>
        </div>
      `;
      loadProjects();
    }

    let activeTag = '';
    function selectTag(tag) {
      activeTag = tag;
      document.querySelectorAll('#tag-filters button').forEach(b => { b.className = 'badge'; });
      const sel = tag ? document.getElementById('tag-btn-' + tag.replace(/[^a-zA-Z]/g, '')) : document.getElementById('tag-btn-all');
      if (sel) sel.className = 'badge badge-indigo';
      loadProjects();
    }

    function loadProjects() {
      const search = document.getElementById('search-input')?.value.toLowerCase() || '';
      const school = document.getElementById('school-input')?.value.toLowerCase() || '';
      
      let list = store.projects || [];

      if (activeTag) list = list.filter(p => p.tags && p.tags.includes(activeTag));
      if (search) list = list.filter(p => p.name.toLowerCase().includes(search) || p.description.toLowerCase().includes(search));
      if (school) {
        list = list.filter(p => {
          const leader = store.users.find(u => u.id === p.leaderId);
          return leader && leader.school && leader.school.toLowerCase().includes(school);
        });
      }

      const grid = document.getElementById('projects-grid');
      if (!grid) return;

      if (list.length === 0) {
        grid.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--c-sand);">
            <div style="font-size:2.5rem; margin-bottom:10px;">🚀</div>
            <h3 style="font-size:1.1rem; color:var(--c-cream); margin-bottom:6px;">No projects created yet</h3>
            <p class="text-muted text-sm" style="margin-bottom:16px;">Create a project to start collaborating with team members across different profiles!</p>
            <button onclick="navigate('new-project')" class="btn btn-primary">+ Create Project</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(p => {
        const leader = store.users.find(u => u.id === p.leaderId);
        const memberCount = store.members.filter(m => m.projectId === p.id).length || 1;
        const isPrivate = p.visibility === 'PRIVATE';
        const isLeader = currentUser && p.leaderId === currentUser.id;
        const isMember = isLeader || (currentUser && store.members.some(m => m.projectId === p.id && m.userId === currentUser.id));

        return `
          <div class="glass-card flex flex-col justify-between" style="cursor:pointer;" onclick="handleProjectCardClick('${p.id}')">
            <div>
              <div class="flex justify-between items-center" style="margin-bottom:8px;">
                <div style="display:flex; align-items:center; gap:6px;">
                  <h3 style="font-size:1.1rem; font-weight:600; color:var(--c-cream);">${escapeHtml(p.name)}</h3>
                  ${isPrivate ? '<span class="badge badge-yellow">🔒 Private</span>' : ''}
                </div>
                <span class="badge">${memberCount} member${memberCount !== 1 ? 's' : ''}</span>
              </div>
              <p class="text-muted text-sm" style="margin-bottom:12px;">${escapeHtml(p.description)}</p>
              <div style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:16px;">
                ${(p.tags || []).map(t => `<span class="badge badge-indigo">${t}</span>`).join('')}
              </div>
            </div>
            <div class="flex justify-between items-center" style="padding-top:10px; border-top:1px solid rgba(221,213,205,0.2);">
              <div style="font-size:0.75rem; color:var(--c-sand);">
                <div>Led by <strong>${leader ? escapeHtml(leader.name) : 'Leader'}</strong></div>
                ${leader && leader.school ? `<div>🎓 ${escapeHtml(leader.school)}</div>` : ''}
              </div>
              <button class="btn btn-secondary btn-sm">${isPrivate && !isMember ? 'Unlock &rarr;' : 'Open &rarr;'}</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleProjectCardClick(projId) {
      const p = store.projects.find(x => x.id === projId);
      if (!p) return;

      const isLeader = currentUser && p.leaderId === currentUser.id;

      store.projects = store.projects.filter(x => x.id !== projId);
      store.members = store.members.filter(x => x.projectId !== projId);
      store.tasks = store.tasks.filter(x => x.projectId !== projId);
      store.polls = store.polls.filter(x => x.projectId !== projId);
      store.pollVotes = store.pollVotes.filter(x => !store.polls.some(p => p.id === x.pollId));

      store.media = store.media.filter(x => x.projectId !== projId);
      store.joinRequests = store.joinRequests.filter(x => x.projectId !== projId);

      closeModal();
      showToast("Project permanently deleted.");

    // --- FILE & MEDIA HELPER STATE ---
    // --- PROFANITY & SENSITIVE CONTENT CENSORSHIP FILTER ---
    const BANNED_PATTERNS = [
      /\b(fuck|fucking|fucker|shit|shitting|bitch|bitches|asshole|bastard|dick|dicks|pussy|cunt|nigger|nigga|faggot|slut|whore|retard|scam|scammer)\b/gi
    ];

    function censorProfanity(text) {
      if (!text) return text;
      let cleaned = String(text);
      BANNED_PATTERNS.forEach(regex => {
        cleaned = cleaned.replace(regex, match => '*'.repeat(match.length));
      });
      return cleaned;
    }

    // --- FILE & MEDIA HELPER STATE ---
    let stagedFiles = { project: null, global: null };

    function formatFileSize(bytes) {
      if (!bytes) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function triggerFileInput(scope) {
      const input = document.getElementById(scope + '-file-input');
      if (input) input.click();

    // --- AUDIO / VOICE MESSAGE RECORDER ---
    let audioRecorder = null;
    let audioRecordChunks = [];
    let isRecordingVoice = false;
    let voiceTimer = null;
    let voiceSeconds = 0;

    async function toggleAudioRecording(scope, projId = '') {
      if (isRecordingVoice) {
        stopAudioRecording(scope, projId, true);
      } else {
        startAudioRecording(scope, projId);
      }
    }

    async function startAudioRecording(scope, projId = '') {
      if (!currentUser) { showAuthModal('signup'); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioRecordChunks = [];
        audioRecorder = new MediaRecorder(stream);

        audioRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioRecordChunks.push(e.data);
        };

        audioRecorder.onstop = async () => {
          const audioBlob = new Blob(audioRecordChunks, { type: 'audio/webm' });
          stream.getTracks().forEach(t => t.stop());

          if (audioBlob.size > 100) {
            const reader = new FileReader();
            reader.onload = async function(evt) {
              const base64Audio = evt.target.result;
              await sendVoiceMessage(base64Audio, scope, projId);
            };
            reader.readAsDataURL(audioBlob);
          }
        };

        audioRecorder.start();
        isRecordingVoice = true;
        voiceSeconds = 0;
        updateAudioRecordingUI(scope, true);

        voiceTimer = setInterval(() => {
          voiceSeconds++;
          const timerEl = document.getElementById(scope + '-recording-timer');
          if (timerEl) {
            const mins = Math.floor(voiceSeconds / 60);
            const secs = voiceSeconds % 60;
            timerEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
          }
        }, 1000);
      } catch (err) {
        showToast("Microphone access unavailable or denied.", true);
      }
    }

    function stopAudioRecording(scope, projId = '', send = true) {
      if (!isRecordingVoice || !audioRecorder) return;
      if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
      if (!send) audioRecordChunks = [];
      audioRecorder.stop();
      isRecordingVoice = false;
      updateAudioRecordingUI(scope, false);
    }

    function updateAudioRecordingUI(scope, recording) {
      const bar = document.getElementById(scope + '-audio-bar');
      const micBtn = document.getElementById(scope + '-mic-btn');
      if (bar) bar.style.display = recording ? 'flex' : 'none';
      if (micBtn) {
        micBtn.style.color = recording ? '#ff4d4f' : 'inherit';
        micBtn.innerHTML = recording ? '⏹️' : '🎙️';
      }
    }

    async function sendVoiceMessage(audioData, scope, projId = '') {
      if (!currentUser) return;
      const newMsg = {
        id: "msg_voice_" + Date.now(),
        projectId: scope === 'project' ? projId : null,
        senderId: currentUser.id,
        content: "🎙️ Voice Message",

      };

      if (scope === 'project' && projId) {
        store.media.push({

          name: `Voice Audio from ${currentUser.name}`,

    function handleTyping(roomId) {
      if (!currentUser) return;
      if (!store.typing) store.typing = {};
      store.typing[roomId] = {
        userId: currentUser.id,
        userName: currentUser.name,
        timestamp: Date.now()
      };
      
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        if (store.typing && store.typing[roomId]) {
          delete store.typing[roomId];
          saveState();
        }
      }, 3000);
      saveState();
    }

    function renderTypingStatus(elementId, roomId) {
      const el = document.getElementById(elementId);
      if (!el || !store.typing || !store.typing[roomId]) {
        if (el) el.style.display = 'none';
        return;
      }
      const t = store.typing[roomId];
      if (currentUser && t.userId === currentUser.id) {
        el.style.display = 'none';
        return;
      }
      if (Date.now() - t.timestamp < 4000) {
        el.style.display = 'inline-flex';
        el.innerHTML = `<span>${escapeHtml(t.userName)} is typing</span><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
      } else {
        el.style.display = 'none';
      }
    }

    function renderPresenceList(elementId, projId) {
      const container = document.getElementById(elementId);
      if (!container) return;

      const now = Date.now();
      const onlineThreshold = 15000;

      let candidateUsers = store.users;
      if (projId) {
        const projectMemberIds = store.members.filter(m => m.projectId === projId).map(m => m.userId);
        const proj = store.projects.find(p => p.id === projId);
        if (proj) projectMemberIds.push(proj.leaderId);
        candidateUsers = store.users.filter(u => projectMemberIds.includes(u.id));
      }

      let onlineCount = 0;
      const html = candidateUsers.map(u => {
        const lastActive = (store.presence && store.presence[u.id]) || 0;
        const isOnline = (now - lastActive < onlineThreshold) || (currentUser && currentUser.id === u.id);
        if (isOnline) onlineCount++;

        return `
          <div style="display:flex; align-items:center; justify-content:space-between; font-size:0.8rem; background:var(--c-charcoal-dark); padding:6px 10px; border-radius:6px; border:1px solid rgba(221,213,205,0.15);">
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="status-dot ${isOnline ? 'status-online' : 'status-offline'}"></span>
              <span style="font-weight:500;">${escapeHtml(u.name)}</span>
            </div>
            <span class="text-xs text-muted" style="font-size:10px;">${isOnline ? 'Online' : 'Offline'}</span>
          </div>
        `;
      }).join('');

      container.innerHTML = html || '<div class="text-muted text-xs">No active members</div>';
      
      const countBadge = document.getElementById(projId ? 'project-online-count' : 'global-online-count');
      if (countBadge) countBadge.innerText = Math.max(1, onlineCount);
    }

    async function sendProjectMessage(e, projId) {
      e.preventDefault();
      if (!currentUser) { showAuthModal('signup'); return; }
      const input = document.getElementById('proj-msg-input');
      const rawContent = input ? input.value.trim() : '';
      const content = censorProfanity(rawContent);
      const attachedFile = stagedFiles.project;

      if (!content && !attachedFile) return;

      if (input) input.value = '';

      if (store.typing && store.typing['proj_' + projId]) {
        delete store.typing['proj_' + projId];
      }

      const newMsg = {
        id: "msg_" + Date.now(),
        projectId: projId,
        senderId: currentUser.id,
        content: content,
        file: attachedFile || null,
        createdAt: new Date().toISOString()
      };

      // Auto-populate Project Media Section with uploaded file!
      if (attachedFile) {
        store.media.push({
          id: "med_file_" + Date.now(),
          projectId: projId,
          name: attachedFile.name,
          url: attachedFile.data,
          type: attachedFile.type,
          size: attachedFile.size,
          sharedBy: currentUser.name,
          createdAt: new Date().toISOString()
        });
      }

      store.messages.push(newMsg);
      clearStagedFile('project');
      await saveState();
      loadProjectChat(projId);
    }

                <div style="background:var(--c-charcoal-dark); border:1px solid rgba(221,213,205,0.2); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:6px;">

    function updateTaskStatus(taskId, status, projId) {

      const container = document.getElementById('project-tab-content');
      if (!container) return;
      container.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div class="flex justify-between items-center">

      `;
      const polls = store.polls.filter(p => p.projectId === projId);
      const box = document.getElementById('polls-list');
      if (polls.length === 0) {
        box.innerHTML = '<div class="glass-card" style="text-align:center; padding:30px; color:var(--c-sand);">No polls created yet.</div>';
        return;
      }
      box.innerHTML = polls.map(p => {
        const votes = store.pollVotes.filter(v => v.pollId === p.id);
        const totalVotes = votes.length;
        const userVote = currentUser ? votes.find(v => v.userId === currentUser.id)?.optionIndex : null;

        return `
          <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
            <div style="font-size:1rem; font-weight:600;">${escapeHtml(p.question)}</div>

            <div style="display:flex; flex-direction:column; gap:8px;">
              ${p.options.map((opt, idx) => {
                const count = votes.filter(v => v.optionIndex === idx).length;
                const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                const hasVoted = userVote === idx;
                return `
                  <button onclick="votePoll('${p.id}', ${idx}, '${projId}')" class="btn btn-secondary flex justify-between items-center" style="text-align:left; padding:10px 14px; position:relative; overflow:hidden;">

                    <span style="position:relative; z-index:2;">${escapeHtml(opt)} ${hasVoted ? '✓' : ''}</span>
                    <span class="text-muted text-xs" style="position:relative; z-index:2;">${count} votes (${pct}%)</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function votePoll(pollId, idx, projId) {
      if (!currentUser) { showAuthModal('signup'); return; }
      const existing = store.pollVotes.find(v => v.pollId === pollId && v.userId === currentUser.id);
      if (existing) { existing.optionIndex = idx; }
      else { store.pollVotes.push({ pollId, userId: currentUser.id, optionIndex: idx }); }
      saveState();
      loadProjectPolls(projId);
    }

    // --- JOIN REQUESTS (ONLY PROJECT LEADER CAN APPROVE OR DENY) ---
    function loadProjectRequests(projId) {
      const container = document.getElementById('project-tab-content');
      if (!container) return;
      const proj = store.projects.find(p => p.id === projId);
      const isLeader = proj && currentUser && proj.leaderId === currentUser.id;

      if (!isLeader) {
        container.innerHTML = '<div class="glass-card" style="text-align:center; padding:30px; color:var(--c-burgundy);">🔒 Access Restricted: Only the project leader can view and approve member requests.</div>';
        return;
      }

      const requests = store.joinRequests.filter(r => r.projectId === projId && r.status === 'PENDING');
      container.innerHTML = `
        <div class="glass-card" style="display:flex; flex-direction:column; gap:16px;">
          <h3 style="font-weight:600;">Pending Join Requests (${requests.length})</h3>
          ${requests.length === 0 ? '<div class="text-muted text-sm" style="text-align:center; padding:20px;">No pending join requests</div>' : ''}
          <div style="display:flex; flex-direction:column; gap:10px;">
            ${requests.map(r => {
              const u = store.users.find(x => x.id === r.userId) || { name: 'User' };
              return `
                <div class="flex justify-between items-center" style="background:var(--c-charcoal-dark); padding:12px 16px; border-radius:8px; border:1px solid rgba(221,213,205,0.2);">
                  <div>
                    <div style="font-weight:500;">${escapeHtml(u.name)}</div>
                    <div class="text-muted text-xs">${escapeHtml(u.school || '')}</div>
                  </div>
                  <div style="display:flex; gap:8px;">
                    <button onclick="handleJoinRequest('${r.id}', 'DENIED', '${projId}')" class="btn btn-secondary btn-sm" style="color:var(--c-burgundy);">Deny</button>
                    <button onclick="handleJoinRequest('${r.id}', 'APPROVED', '${projId}')" class="btn btn-primary btn-sm">Approve</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function handleJoinRequest(reqId, action, projId) {
      const proj = store.projects.find(p => p.id === projId);
      if (!proj || !currentUser || proj.leaderId !== currentUser.id) {
        showToast("Unauthorized: Only the project leader can approve or deny requests!", true);
        return;
      }

      const r = store.joinRequests.find(x => x.id === reqId);
      if (r) {
        r.status = action;
        if (action === 'APPROVED') {
          if (!store.members.some(m => m.projectId === projId && m.userId === r.userId)) {
            store.members.push({ projectId: projId, userId: r.userId });
          }
        }
        saveState();
      }
      showToast(action === 'APPROVED' ? 'Member approved!' : 'Request denied.');
      loadProjectRequests(projId);
      renderProjectView(projId);
    }

    function togglePrivatePasswordInput(vis) {
      const box = document.getElementById('private-password-box');
      if (vis === 'PRIVATE') {
        box.style.display = 'block';
        document.getElementById('new-proj-pass').required = true;
      } else {
        box.style.display = 'none';
        document.getElementById('new-proj-pass').required = false;
      }
    }

    let selectedTags = [];
    function toggleTag(t, btn) {
      if (selectedTags.includes(t)) {
        selectedTags = selectedTags.filter(x => x !== t);
        btn.className = 'badge';
      } else {
        selectedTags.push(t);
        btn.className = 'badge badge-indigo';
      }
    }

    async function submitNewProject(e) {
      e.preventDefault();
      const name = document.getElementById('new-proj-name').value.trim();
      const description = document.getElementById('new-proj-desc').value.trim();
      const visibility = document.getElementById('new-proj-vis').value;
      const password = visibility === 'PRIVATE' ? document.getElementById('new-proj-pass').value.trim() : "";

      const newProj = {
        id: "p_" + Date.now() + "_" + Math.random().toString(36).substring(2, 6),
        name,
        description,
        visibility,
        password,
        tags: selectedTags,
        leaderId: currentUser.id,
        createdAt: new Date().toISOString()
      };

      store.projects.unshift(newProj);
      store.members.push({ projectId: newProj.id, userId: currentUser.id });
      await saveState();
      selectedTags = [];
      showToast('Project created & synced live to cloud!');
      navigate('project', newProj.id);
    }

    function loadGlobalChat() {
      const msgs = store.messages.filter(m => !m.projectId && (!currentUser || !m.deletedFor || !m.deletedFor.includes(currentUser.id)));

      if (!box) return;
      if (msgs.length === 0) {
        box.innerHTML = '<div style="text-align:center; color:var(--c-sand); margin:auto;">No messages yet. Be the first to say hello to everyone! 🌐</div>';
      } else {
        box.innerHTML = msgs.map(m => {
          const isMe = currentUser && m.senderId === currentUser.id;
          const sender = store.users.find(u => u.id === m.senderId) || { name: 'User' };
          
          if (m.isDeleted) {
            return `
              <div style="display:flex; flex-direction:column; align-items:${isMe ? 'flex-end' : 'flex-start'}; margin-bottom:8px;">

                  🚫 This message was deleted
                </div>
              </div>
            `;
          }

          const msgAgeMs = Date.now() - new Date(m.createdAt).getTime();
          const canEdit = isMe && !m.isDeleted && (msgAgeMs <= 5 * 60 * 1000) && !m.audio && !m.file;
          const canDeleteEveryone = isMe && !m.isDeleted;
          const canDeleteMe = !!currentUser;

          let fileMarkup = '';
          if (m.file) {
            if (m.file.type && m.file.type.startsWith('image/')) {
              fileMarkup = `<img src="${m.file.data}" alt="${escapeHtml(m.file.name)}" onclick="openImageModal('${m.file.data}')" style="max-width:240px; max-height:180px; border-radius:8px; display:block; margin-top:6px; cursor:pointer; border:1px solid rgba(221,213,205,0.2);" />`;

            }

          let audioMarkup = '';
          if (m.audio && m.audio.data) {
            audioMarkup = `
              <div style="margin-top:6px; display:flex; flex-direction:column; gap:4px;">
                <audio controls src="${m.audio.data}" style="height:36px; max-width:240px; border-radius:18px; outline:none;"></audio>
              </div>
            `;
          }

          let linkMarkup = '';
          if (m.link) {
            linkMarkup = `
              <a href="${escapeHtml(m.link.url)}" target="_blank" style="display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.3); border:1px solid var(--c-burgundy); padding:8px 12px; border-radius:8px; margin-top:6px; text-decoration:none; color:inherit;">

              <div class="msg-bubble ${isMe ? 'msg-me' : 'msg-other'}">

            </div>
          `;
        }).join('');
        box.scrollTop = box.scrollHeight;

      renderTypingStatus('global-typing-indicator', 'global');
    }

    async function sendGlobalMessage(e) {
      e.preventDefault();
      if (!currentUser) { showAuthModal('signup'); return; }
      const input = document.getElementById('global-msg-input');
      const rawContent = input ? input.value.trim() : '';
      const content = censorProfanity(rawContent);
      const attachedFile = stagedFiles.global;

      if (!content && !attachedFile) return;

      if (input) input.value = '';

      if (store.typing && store.typing['global']) {
        delete store.typing['global'];
      }

      store.messages.push({
        id: "msg_" + Date.now(),
        projectId: null,
        senderId: currentUser.id,
        content: content,
        file: attachedFile || null,
        createdAt: new Date().toISOString()
      });

      clearStagedFile('global');
      await saveState();
      loadGlobalChat();
    }
